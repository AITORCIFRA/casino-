<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREMIUM CASINO LOBBY - Selecciona tu Juego</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/js/wallet.js"></script>
<style>
:root { 
    --felt: #1a6b8f; 
    --gold: #f4c430; 
    --border: rgba(255, 255, 255, 0.3);
    --green: #00ff99;
    --neon-blue: #00d2ff;
    --neon-purple: #9d50bb;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html, body { width: 100%; height: 100%; overflow-x: hidden; }
body { 
    background: #050a0f;
    color: #fff; 
    font-family: 'Rajdhani', sans-serif; 
}

.lobby-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 20px;
}

.lobby-header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeIn 0.8s ease-in;
}

.lobby-title {
    font-family: 'Bebas Neue';
    font-size: 84px;
    color: var(--gold);
    text-shadow: 0 0 30px var(--gold), 0 0 60px rgba(244, 196, 48, 0.5);
    margin-bottom: 10px;
    letter-spacing: 5px;
}

.lobby-subtitle {
    font-family: 'Orbitron';
    font-size: 24px;
    color: var(--green);
    text-shadow: 0 0 20px var(--green);
    text-transform: uppercase;
    letter-spacing: 2px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    border: 1px solid var(--border);
}

.user-info {
    display: flex;
    align-items: center;
    gap: 20px;
}

.lobby-balance {
    font-family: 'Orbitron';
    font-size: 24px;
    color: var(--green);
    background: rgba(0, 255, 153, 0.1);
    padding: 10px 25px;
    border: 2px solid var(--green);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 255, 153, 0.2);
}

.category-tabs {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.tab {
    padding: 12px 30px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--border);
    border-radius: 30px;
    font-family: 'Orbitron';
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.tab.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(244, 196, 48, 0.4);
}

.games-section {
    margin-bottom: 60px;
}

.section-title {
    font-family: 'Bebas Neue';
    font-size: 48px;
    color: #fff;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
}

.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
}

.game-card {
    background: #111;
    border: 2px solid #333;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
}

.game-card:hover {
    transform: translateY(-10px) scale(1.03);
    border-color: var(--gold);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(244, 196, 48, 0.2);
}

.game-thumb {
    width: 100%;
    aspect-ratio: 1/1;
    background-size: cover;
    background-position: center;
    position: relative;
}

.game-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.9));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
    transition: all 0.3s ease;
}

.game-card:hover .game-overlay {
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
}

.game-name {
    font-family: 'Orbitron';
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 5px;
}

.game-category {
    font-size: 12px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.jackpot-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: linear-gradient(45deg, #ff0000, #ff8c00);
    padding: 5px 12px;
    border-radius: 20px;
    font-family: 'Orbitron';
    font-size: 12px;
    font-weight: 900;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
    to { box-shadow: 0 0 20px rgba(255, 0, 0, 0.8); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.footer {
    text-align: center;
    padding: 40px;
    color: #555;
    font-size: 14px;
    border-top: 1px solid #222;
    margin-top: 60px;
}

/* Modal de entrada épica */
#loadingOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.loading-bar {
    width: 300px;
    height: 4px;
    background: #222;
    border-radius: 2px;
    margin-top: 20px;
    overflow: hidden;
}

.loading-progress {
    width: 0%;
    height: 100%;
    background: var(--gold);
    box-shadow: 0 0 15px var(--gold);
    transition: width 0.3s ease;
}
</style>
</head>
<body>

<div class="lobby-container">
    <div class="lobby-header">
        <div class="lobby-title">PREMIUM CASINO</div>
        <div class="lobby-subtitle">Elite Gaming Experience</div>
    </div>

    <!-- Carrusel 3D Interactivo -->
    <div class="carousel-3d-container">
        <div class="carousel-3d" id="carousel3D">
            <!-- Los items se cargarán dinámicamente -->
        </div>
        <div class="carousel-nav">
            <button onclick="rotateCarousel(-1)">❮</button>
            <button onclick="rotateCarousel(1)">❯</button>
        </div>

    <style>

        perspective: 1500px;
        width: 100%;
        height: 450px;
        display: flex;

        position: absolute;
        width: 350px;

        left: 0;

    .carousel-item .item-info {
        position: absolute;

    }
    .carousel-item h3 {
        font-family: 'Bebas Neue';

    }
    .carousel-item p {
        font-family: 'Orbitron';
        font-size: 14px;
        color: var(--green);
    }
    .carousel-nav {
        margin-top: 40px;
        display: flex;
        gap: 40px;
    }
    .carousel-nav button {
        background: rgba(255,255,255,0.1);

        font-size: 24px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .carousel-nav button:hover {
        background: var(--gold);
        color: #000;
        box-shadow: 0 0 20px var(--gold);
    }
    </style>

    <div class="top-bar">
        <div class="user-info">
            <div class="lobby-balance">
                BALANCE: <span id="balance">0</span>
            </div>
        </div>
        <div class="category-tabs">
            <div class="tab active" onclick="filterGames('all')">TODO</div>
            <div class="tab" onclick="filterGames('Clásicos')">CLÁSICOS</div>
            <div class="tab" onclick="filterGames('Novedades')">NOVEDADES</div>
            <div class="tab" onclick="filterGames('Exclusivos')">EXCLUSIVOS</div>
            <div class="tab" onclick="filterGames('Table')">MESAS</div>
        </div>
    </div>

    <!-- Sección de Craps (Especial) -->
    <div class="games-section" id="crapsSection">
        <div class="section-title">MESAS DE CRAPS PROFESIONAL</div>
        <div class="games-grid" id="crapsGrid">
            <!-- Cargado vía JS -->
        </div>
    </div>

    <!-- Sección de Clásicos -->
    <div class="games-section" id="classicsSection">
        <div class="section-title">CLÁSICOS</div>
        <div class="games-grid" id="classicsGrid">
            <!-- Cargado vía JS -->
        </div>
    </div>

    <!-- Sección de Novedades -->
    <div class="games-section" id="noveltiesSection">
        <div class="section-title">NOVEDADES</div>
        <div class="games-grid" id="noveltiesGrid">
            <!-- Cargado vía JS -->
        </div>
    </div>

    <!-- Sección de Exclusivos -->
    <div class="games-section" id="exclusivesSection">
        <div class="section-title">EXCLUSIVOS</div>
        <div class="games-grid" id="exclusivesGrid">
            <!-- Cargado vía JS -->
        </div>
    </div>

    <style>
    /* Tags de categoría para los nuevos juegos */
    .tag-slot { background: rgba(244,196,48,.15); color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 2px 6px; font-size: .65rem; font-family: 'Rajdhani'; letter-spacing: 1px; }
    .tag-hot { background: rgba(255,68,0,.15); color: #ff4400; border: 1px solid #ff4400; border-radius: 3px; padding: 2px 6px; font-size: .65rem; font-family: 'Rajdhani'; letter-spacing: 1px; }
    .tag-new { background: rgba(0,255,153,.15); color: var(--green); border: 1px solid var(--green); border-radius: 3px; padding: 2px 6px; font-size: .65rem; font-family: 'Rajdhani'; letter-spacing: 1px; }
    .tag-arcade { background: rgba(0,255,136,.15); color: #00ff88; border: 1px solid #00ff88; border-radius: 3px; padding: 2px 6px; font-size: .65rem; font-family: 'Rajdhani'; letter-spacing: 1px; }
    .tag-seasonal { background: rgba(100,200,255,.15); color: #64c8ff; border: 1px solid #64c8ff; border-radius: 3px; padding: 2px 6px; font-size: .65rem; font-family: 'Rajdhani'; letter-spacing: 1px; }
    .tag-exclusive { background: rgba(201,168,76,.2); color: #C9A84C; border: 1px solid #C9A84C; border-radius: 3px; padding: 2px 6px; font-size: .65rem; font-family: 'Rajdhani'; letter-spacing: 1px; }
    .tag-link { background: rgba(0,210,255,.15); color: #00d2ff; border: 1px solid #00d2ff; border-radius: 3px; padding: 2px 6px; font-size: .65rem; font-family: 'Rajdhani'; letter-spacing: 1px; }

    /* Animaciones extra */
    @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-10px) } }
    @keyframes flicker { 0%,100% { opacity:1 } 50% { opacity:.4 } }
    @keyframes shake { 0%,100% { transform:rotate(-5deg) } 50% { transform:rotate(5deg) } }
    @keyframes bounce { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-15px) } }
    @keyframes slide { 0% { transform:translateX(-10px) } 100% { transform:translateX(10px) } }
    @keyframes spin { from { transform:rotate(0deg) } to { transform:rotate(360deg) } }

    /* Arte específico de cada card */
    .slot-art { height: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .pigs-art, .xmas-art { background: linear-gradient(135deg, #1a1a40, #2a1a50); }
    .penalty-art { background: linear-gradient(135deg, #001a00, #003300); }
    .mine-art { background: linear-gradient(135deg, #1a0f00, #2a1a00); }
    .phoenix-art { background: linear-gradient(135deg, #1a0500, #2a0800); }
    .trophy-art { background: linear-gradient(135deg, #0a0a00, #1a1500); }
    .train-art { background: linear-gradient(135deg, #0f0800, #1a1000); }
    .witch-art { background: linear-gradient(135deg, #0a0015, #150030); }
    .ufo-art { background: linear-gradient(135deg, #000a05, #001a0a); }
    .eagle-art { background: linear-gradient(135deg, #0f0800, #1a1000); }
    .viking-art { background: linear-gradient(135deg, #000a15, #001530); }
    .genie-art { background: linear-gradient(135deg, #0f000f, #1a001a); }
    .biker-art { background: linear-gradient(135deg, #150000, #200000); }

    .card-info { padding: 15px; }

    .card-jackpot::before { content: '$'; margin-right: 2px; }
    </style>

    <div class="footer">
        &copy; 2026 Premium Casino Ultimate. Todos los derechos reservados. Juega con responsabilidad.
    </div>
</div>

<div id="loadingOverlay">
    <div class="lobby-title" style="font-size: 48px;">PREPARANDO MESA...</div>
    <div class="loading-bar">
        <div class="loading-progress" id="loadProgress"></div>
    </div>
</div>

<script>
let userBalance = 0;
let allGames = [];

async function initLobby() {
    try {
        // Cargar saldo
        try {
            userBalance = await WalletAPI.getBalance();
        } catch (e) {
            userBalance = 100000; // Mock
        }
        document.getElementById('balance').textContent = userBalance.toLocaleString();

        // Cargar mesas de Craps
        const crapsRes = await fetch('/api/games/craps/tables');
        const crapsTables = await crapsRes.json();
        renderCraps(crapsTables);

        // Cargar nuevos juegos
        const newGamesRes = await fetch('/api/games/new/list');
        allGames = await newGamesRes.json();
        renderNewGames(allGames);
        renderCarousel3D(allGames);

    } catch (error) {
        console.error('Lobby Init Error:', error);
    }
}

function renderCraps(tables) {
    const grid = document.getElementById('crapsGrid');
    const images = {
        'craps_low_stakes': '/assets/tables/table_low.jpg',
        'craps_mid_stakes': '/assets/tables/table_mid.jpg',
        'craps_high_roller': '/assets/tables/table_high.jpg'
    };

    tables.forEach(t => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => playCraps(t.id);
        card.innerHTML = `
            <div class="game-thumb" style="background-image: url('${images[t.id] || images.craps_low_stakes}')">
                <div class="game-overlay">
                    <div class="game-name">${t.name}</div>
                    <div class="game-category">MIN: $${t.minimum_bet.toLocaleString()}</div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function renderNewGames(games) {
    console.log("Rendering games:", games);
    
    if (!games || games.length === 0) {
        document.getElementById('classicsGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; font-family: Orbitron; color: #555;">NO HAY JUEGOS DISPONIBLES</div>';
        return;
    }

    // Separar juegos por categoria
    const classics = games.filter(g => g.group === 'Clásicos');
    const novelties = games.filter(g => g.group === 'Novedades');
    const exclusives = games.filter(g => g.group === 'Exclusivos');

    const imgMap = {
        'triad_pigs_olympus': 'triad_pigs.png',
        'penalty_pro_championship': 'penalty_pro.png',
        'jolly_pigs_christmas': 'jolly_pigs.png',
        'gold_mine_blast': 'gold_mine.png',
        'inferno_phoenix_blaze': 'inferno_phoenix.png',
        'golden_goal_nations': 'golden_goal.png',
        'steam_train_tycoon': 'steam_train.png',
        'witchs_wicked_wares': 'witch_wicked.png',
        'ufo_farm_abduction': 'ufo_farm.png',
        'sky_eagle_cash': 'sky_eagle.png',
        'viking_raidmark': 'viking_raidmark.png',
        'mystic_genie_dreams': 'mystic_genie.png',
        'outlaw_roadquake': 'outlaw_roadquake.png'
    };

    function renderGamesInGrid(gamesList, gridId) {
        const grid = document.getElementById(gridId);
        grid.innerHTML = '';
        
        gamesList.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.setAttribute('data-category', g.category);
            card.setAttribute('data-group', g.group);
            card.onclick = () => playNewGame(g.game_id);
            
            const thumb = `/assets/slots/${imgMap[g.game_id] || 'default_slot.png'}`;

            card.innerHTML = `
                <div class="card-art" style="height: 220px; position: relative; overflow: hidden; background-image: url('${thumb}'); background-size: cover; background-position: center; border-bottom: 1px solid #333;">
                    <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.8));"></div>
                    ${g.jackpot > 0 ? `<div class="jackpot-badge">JACKPOT</div>` : ''}
                </div>
                <div class="card-info">
                    <div class="card-title">${g.name}</div>
                    <div class="card-sub">${g.category} | ${g.group}</div>
                    <div class="card-tags" style="margin-top: 10px; display: flex; gap: 5px;">
                        <span class="tag-slot">${g.rtp}% RTP</span>
                        <span class="tag-new">NUEVO</span>
                    </div>
                    <div class="card-jackpot" id="jp-${g.game_id}">${Number(g.jackpot).toLocaleString()}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    renderGamesInGrid(classics, 'classicsGrid');
    renderGamesInGrid(novelties, 'noveltiesGrid');
    renderGamesInGrid(exclusives, 'exclusivesGrid');

    startJackpotUpdates();
}


function startJackpotUpdates() {
    if (window.jackpotInterval) clearInterval(window.jackpotInterval);
    
    async function fetchJackpots() {
        try {
            const res = await fetch('/api/games/new/jackpots');
            if (!res.ok) return;
            const data = await res.json();
            for (const [gid, val] of Object.entries(data.jackpots)) {
                const el = document.getElementById('jp-' + gid);
                if (el) el.textContent = Number(val).toLocaleString();
            }
        } catch (e) {
            console.warn('Error fetching jackpots:', e);
        }
    }

    fetchJackpots();
    window.jackpotInterval = setInterval(fetchJackpots, 3000);
}

let currentRotation = 0;
function renderCarousel3D(games) {
    const carousel = document.getElementById('carousel3D');
    if (!carousel) return;
    carousel.innerHTML = '';
    
    // Seleccionar 8 juegos destacados para el carrusel
    const featured = games.slice(0, 8);
    if (featured.length === 0) return;

    const angleStep = 360 / featured.length;
    const radius = 500; // Radio del círculo 3D

    const imgMap = {
        'triad_pigs_olympus': 'triad_pigs.png',
        'penalty_pro_championship': 'penalty_pro.png',
        'jolly_pigs_christmas': 'jolly_pigs.png',
        'gold_mine_blast': 'gold_mine.png',
        'inferno_phoenix_blaze': 'inferno_phoenix.png',
        'golden_goal_nations': 'golden_goal.png',
        'steam_train_tycoon': 'steam_train.png',
        'witchs_wicked_wares': 'witch_wicked.png',
        'ufo_farm_abduction': 'ufo_farm.png',
        'sky_eagle_cash': 'sky_eagle.png',
        'viking_raidmark': 'viking_raidmark.png',
        'mystic_genie_dreams': 'mystic_genie.png',
        'outlaw_roadquake': 'outlaw_roadquake.png'
    };

    featured.forEach((g, i) => {
        const item = document.createElement('div');
        item.className = 'carousel-item';
        const angle = i * angleStep;
        item.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
        
        // Hacer que todo el item sea clickeable
        item.addEventListener('click', (e) => {
            e.stopPropagation();
            playNewGame(g.game_id);
        });
        
        const thumb = `/assets/slots/${imgMap[g.game_id] || 'default_slot.png'}`;
        
        item.innerHTML = `
            <img src="${thumb}" alt="${g.name}" style="pointer-events: none;">
            <div class="item-info" style="pointer-events: none;">
                <h3>${g.name}</h3>
                <p>${g.category} | ${g.group}</p>
            </div>
        `;
        carousel.appendChild(item);
    });
}

function rotateCarousel(direction) {
    const carousel = document.getElementById('carousel3D');
    const angleStep = 360 / 8; // Basado en 8 items destacados
    currentRotation -= direction * angleStep;
    carousel.style.transform = `rotateY(${currentRotation}deg)`;
}

function filterGames(filter) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    const cards = document.querySelectorAll('#newGamesGrid .game-card');
    cards.forEach(c => {
        const category = c.getAttribute('data-category');
        const group = c.getAttribute('data-group');
        
        if (filter === 'all' || category === filter || group === filter) {
            c.style.display = 'block';
        } else {
            c.style.display = 'none';
        }
    });
}

function playCraps(id) {
    startLoading(() => window.location.href = `/craps.html?table_id=${id}`);
}

function playNewGame(id) {
    // Redirigir al archivo HTML específico del juego
    startLoading(() => window.location.href = `/${id}.html`);
}

function startLoading(callback) {
    const overlay = document.getElementById('loadingOverlay');
    const progress = document.getElementById('loadProgress');
    overlay.style.display = 'flex';
    
    let p = 0;
    const interval = setInterval(() => {
        p += Math.random() * 30;
        if (p >= 100) {
            p = 100;
            clearInterval(interval);
            setTimeout(callback, 200);
        }
        progress.style.width = p + '%';
    }, 150);
}

window.onload = initLobby;
</script>
