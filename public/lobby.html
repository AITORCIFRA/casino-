<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREMIUM CASINO LOBBY - Selecciona tu Juego</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/js/wallet.js"></script>
<style>
:root { 
    --felt: #1a6b8f; 
    --gold: #f4c430; 
    --border: rgba(255, 255, 255, 0.3);
    --green: #00ff99;
    --neon-blue: #00d2ff;
    --neon-purple: #9d50bb;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html, body { width: 100%; height: 100%; overflow-x: hidden; }
body { 
    background: #050a0f;
    color: #fff; 
    font-family: 'Rajdhani', sans-serif; 
}

.lobby-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 20px;
}

.lobby-header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeIn 0.8s ease-in;
}

.lobby-title {
    font-family: 'Bebas Neue';
    font-size: 84px;
    color: var(--gold);
    text-shadow: 0 0 30px var(--gold), 0 0 60px rgba(244, 196, 48, 0.5);
    margin-bottom: 10px;
    letter-spacing: 5px;
}

.lobby-subtitle {
    font-family: 'Orbitron';
    font-size: 24px;
    color: var(--green);
    text-shadow: 0 0 20px var(--green);
    text-transform: uppercase;
    letter-spacing: 2px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    border: 1px solid var(--border);
}

.user-info {
    display: flex;
    align-items: center;
    gap: 20px;
}

.lobby-balance {
    font-family: 'Orbitron';
    font-size: 24px;
    color: var(--green);
    background: rgba(0, 255, 153, 0.1);
    padding: 10px 25px;
    border: 2px solid var(--green);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 255, 153, 0.2);
}

.category-tabs {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.tab {
    padding: 12px 30px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--border);
    border-radius: 30px;
    font-family: 'Orbitron';
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.tab.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(244, 196, 48, 0.4);
}

.games-section {
    margin-bottom: 60px;
}

.section-title {
    font-family: 'Bebas Neue';
    font-size: 48px;
    color: #fff;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
}

.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
}

.game-card {
    background: #111;
    border: 2px solid #333;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
}

.game-card:hover {
    transform: translateY(-10px) scale(1.03);
    border-color: var(--gold);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(244, 196, 48, 0.2);
}

.game-thumb {
    width: 100%;
    aspect-ratio: 1/1;
    background-size: cover;
    background-position: center;
    position: relative;
}

.game-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.9));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
    transition: all 0.3s ease;
}

.game-card:hover .game-overlay {
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
}

.game-name {
    font-family: 'Orbitron';
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 5px;
}

.game-category {
    font-size: 12px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.jackpot-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: linear-gradient(45deg, #ff0000, #ff8c00);
    padding: 5px 12px;
    border-radius: 20px;
    font-family: 'Orbitron';
    font-size: 12px;
    font-weight: 900;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
    to { box-shadow: 0 0 20px rgba(255, 0, 0, 0.8); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.footer {
    text-align: center;
    padding: 40px;
    color: #555;
    font-size: 14px;
    border-top: 1px solid #222;
    margin-top: 60px;
}

/* Modal de entrada épica */
#loadingOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.loading-bar {
    width: 300px;
    height: 4px;
    background: #222;
    border-radius: 2px;
    margin-top: 20px;
    overflow: hidden;
}

.loading-progress {
    width: 0%;
    height: 100%;
    background: var(--gold);
    box-shadow: 0 0 15px var(--gold);
    transition: width 0.3s ease;
}
</style>
</head>
<body>

<div class="lobby-container">
    <div class="lobby-header">
        <div class="lobby-title">PREMIUM CASINO</div>
        <div class="lobby-subtitle">Elite Gaming Experience</div>
    </div>

    <div class="top-bar">
        <div class="user-info">
            <div class="lobby-balance">
                BALANCE: <span id="balance">0</span>
            </div>
        </div>
        <div class="category-tabs">
            <div class="tab active" onclick="filterGames('all')">TODO</div>
            <div class="tab" onclick="filterGames('Video Slot')">SLOTS</div>
            <div class="tab" onclick="filterGames('Arcade')">ARCADE</div>
            <div class="tab" onclick="filterGames('Table')">MESAS</div>
            <div class="tab" onclick="filterGames('Exclusive')">EXCLUSIVOS</div>
        </div>
    </div>

    <!-- Sección de Craps (Especial) -->
    <div class="games-section" id="crapsSection">
        <div class="section-title">MESAS DE CRAPS PROFESIONAL</div>
        <div class="games-grid" id="crapsGrid">
            <!-- Cargado vía JS -->
        </div>
    </div>

    <!-- Sección de Nuevos Juegos -->
    <div class="games-section">
        <div class="section-title">NUEVOS SLOTS & ARCADE</div>
        <div class="games-grid" id="newGamesGrid">
            <!-- Cargado vía JS -->
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Premium Casino Ultimate. Todos los derechos reservados. Juega con responsabilidad.
    </div>
</div>

<div id="loadingOverlay">
    <div class="lobby-title" style="font-size: 48px;">PREPARANDO MESA...</div>
    <div class="loading-bar">
        <div class="loading-progress" id="loadProgress"></div>
    </div>
</div>

<script>
let userBalance = 0;
let allGames = [];

async function initLobby() {
    try {
        // Cargar saldo
        try {
            userBalance = await WalletAPI.getBalance();
        } catch (e) {
            userBalance = 100000; // Mock
        }
        document.getElementById('balance').textContent = userBalance.toLocaleString();

        // Cargar mesas de Craps
        const crapsRes = await fetch('/api/games/craps/tables');
        const crapsTables = await crapsRes.json();
        renderCraps(crapsTables);

        // Cargar nuevos juegos
        const newGamesRes = await fetch('/api/games/new/list');
        allGames = await newGamesRes.json();
        renderNewGames(allGames);

    } catch (error) {
        console.error('Lobby Init Error:', error);
    }
}

function renderCraps(tables) {
    const grid = document.getElementById('crapsGrid');
    const images = {
        'craps_low_stakes': '/assets/tables/table_low.jpg',
        'craps_mid_stakes': '/assets/tables/table_mid.jpg',
        'craps_high_roller': '/assets/tables/table_high.jpg'
    };

    tables.forEach(t => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => playCraps(t.id);
        card.innerHTML = `
            <div class="game-thumb" style="background-image: url('${images[t.id] || images.craps_low_stakes}')">
                <div class="game-overlay">
                    <div class="game-name">${t.name}</div>
                    <div class="game-category">MIN: $${t.minimum_bet.toLocaleString()}</div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function renderNewGames(games) {
    const grid = document.getElementById('newGamesGrid');
    grid.innerHTML = '';
    
    games.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.setAttribute('data-category', g.category);
        card.onclick = () => playNewGame(g.game_id);
        
        const thumb = `/assets/slots/${g.game_id.replace(/_olympus|_championship|_christmas|_blast|_blaze|_nations|_tycoon|_wicked|_abduction|_cash|_raidmark|_dreams|_roadquake/g, '')}.png`;

        card.innerHTML = `
            <div class="game-thumb" style="background-image: url('${thumb}')">
                ${g.jackpot > 0 ? `<div class="jackpot-badge">JACKPOT: $${g.jackpot.toLocaleString()}</div>` : ''}
                <div class="game-overlay">
                    <div class="game-name">${g.name}</div>
                    <div class="game-category">${g.category}</div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterGames(cat) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    const cards = document.querySelectorAll('#newGamesGrid .game-card');
    cards.forEach(c => {
        if (cat === 'all' || c.getAttribute('data-category') === cat) {
            c.style.display = 'block';
        } else {
            c.style.display = 'none';
        }
    });
}

function playCraps(id) {
    startLoading(() => window.location.href = `/craps.html?table_id=${id}`);
}

function playNewGame(id) {
    // Por ahora redirigimos a una plantilla de slot genérica
    startLoading(() => window.location.href = `/slot_template.html?game_id=${id}`);
}

function startLoading(callback) {
    const overlay = document.getElementById('loadingOverlay');
    const progress = document.getElementById('loadProgress');
    overlay.style.display = 'flex';
    
    let p = 0;
    const interval = setInterval(() => {
        p += Math.random() * 30;
        if (p >= 100) {
            p = 100;
            clearInterval(interval);
            setTimeout(callback, 200);
        }
        progress.style.width = p + '%';
    }, 150);
}

window.onload = initLobby;
</script>

</body>
</html>
