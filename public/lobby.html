<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREMIUM CASINO LOBBY - Selecciona tu Juego</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { 
    --felt: #1a6b8f; 
    --gold: #f4c430; 
    --border: rgba(255, 255, 255, 0.3);
    --green: #00ff99;
    --neon-blue: #00d2ff;
    --neon-purple: #9d50bb;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html, body { width: 100%; height: 100%; overflow-x: hidden; background: #050a0f; color: #fff; font-family: 'Rajdhani', sans-serif; }

.lobby-container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
.lobby-header { text-align: center; margin-bottom: 50px; }
.lobby-title { font-family: 'Bebas Neue'; font-size: 84px; color: var(--gold); text-shadow: 0 0 30px var(--gold); letter-spacing: 5px; }
.lobby-subtitle { font-family: 'Orbitron'; font-size: 24px; color: var(--green); text-shadow: 0 0 20px var(--green); text-transform: uppercase; }

/* 3D Carousel */
.carousel-3d-container { perspective: 1500px; width: 100%; height: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 60px; position: relative; }
.carousel-3d { width: 350px; height: 450px; position: relative; transform-style: preserve-3d; transition: transform 1s cubic-bezier(0.23, 1, 0.32, 1); }
.carousel-item { position: absolute; width: 350px; height: 450px; background: #111; border: 4px solid var(--gold); border-radius: 20px; overflow: hidden; cursor: pointer; backface-visibility: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: all 0.5s ease; }
.carousel-item img { width: 100%; height: 100%; object-fit: cover; }
.carousel-item .item-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.95)); padding: 30px 20px 20px; text-align: center; }
.carousel-item h3 { font-family: 'Bebas Neue'; font-size: 32px; color: var(--gold); }
.carousel-nav { margin-top: 40px; display: flex; gap: 40px; }
.carousel-nav button { background: rgba(255,255,255,0.1); border: 2px solid var(--gold); color: var(--gold); width: 60px; height: 60px; border-radius: 50%; font-size: 24px; cursor: pointer; transition: all 0.3s ease; }
.carousel-nav button:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }

/* Top Bar */
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; border: 1px solid var(--border); }
.lobby-balance { font-family: 'Orbitron'; font-size: 24px; color: var(--green); border: 2px solid var(--green); padding: 10px 25px; border-radius: 10px; }
.category-tabs { display: flex; gap: 15px; }
.tab { padding: 12px 30px; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border); border-radius: 30px; font-family: 'Orbitron'; font-size: 14px; cursor: pointer; transition: all 0.3s; }
.tab.active { background: var(--gold); color: #000; border-color: var(--gold); }

/* Games Grid */
.games-section { margin-bottom: 60px; }
.section-title { font-family: 'Bebas Neue'; font-size: 48px; color: #fff; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
.section-title::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); }
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
.game-card { background: #111; border: 2px solid #333; border-radius: 15px; overflow: hidden; cursor: pointer; transition: all 0.3s; position: relative; }
.game-card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8); }
.card-art { height: 220px; background-size: cover; background-position: center; position: relative; }
.card-info { padding: 15px; }
.card-title { font-family: 'Orbitron'; font-size: 1.1rem; font-weight: 900; color: #fff; }
.card-sub { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; }
.tag-new { background: rgba(0,255,153,.15); color: var(--green); border: 1px solid var(--green); border-radius: 3px; padding: 2px 6px; font-size: .65rem; }

/* Loading Overlay */
#loadingOverlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
.loading-bar { width: 300px; height: 4px; background: #222; border-radius: 2px; margin-top: 20px; overflow: hidden; }
.loading-progress { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }
</style>
</head>
<body>

<div class="lobby-container">
    <div class="lobby-header">
        <div class="lobby-title">PREMIUM CASINO</div>
        <div class="lobby-subtitle">Elite Gaming Experience</div>
    </div>

    <!-- Carrusel 3D Interactivo -->
    <div class="carousel-3d-container">
        <div class="carousel-3d" id="carousel3D"></div>
        <div class="carousel-nav">
            <button onclick="rotateCarousel(-1)">❮</button>
            <button onclick="rotateCarousel(1)">❯</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="lobby-balance">BALANCE: <span id="balance">100,000</span></div>
        <div class="category-tabs">
            <div class="tab active" onclick="filterGames('all')">TODO</div>
            <div class="tab" onclick="filterGames('Clásicos')">CLÁSICOS</div>
            <div class="tab" onclick="filterGames('Novedades')">NOVEDADES</div>
        </div>
    </div>

    <div class="games-section">
        <div class="section-title">TODOS LOS JUEGOS</div>
        <div class="games-grid" id="gamesGrid"></div>
    </div>
</div>

<div id="loadingOverlay">
    <div class="lobby-title" style="font-size: 48px;">PREPARANDO MESA...</div>
    <div class="loading-bar"><div class="loading-progress" id="loadProgress"></div></div>
</div>

<script>
const GAMES = [
    { id: 'triad_pigs_olympus', name: 'The Triad Pigs of Olympus', group: 'Novedades', category: 'Video Slot', thumb: 'assets/slots/triad_pigs.png' },
    { id: 'penalty_pro_championship', name: 'Penalty Pro Championship', group: 'Novedades', category: 'Arcade', thumb: 'assets/slots/penalty_pro.png' },
    { id: 'jolly_pigs_christmas', name: 'Jolly Pigs Christmas', group: 'Clásicos', category: 'Video Slot', thumb: 'assets/slots/jolly_pigs.png' },
    { id: 'gold_mine_blast', name: 'Gold Mine Blast', group: 'Clásicos', category: 'Video Slot', thumb: 'assets/slots/gold_mine.png' },
    { id: 'inferno_phoenix_blaze', name: 'Inferno Phoenix Blaze', group: 'Novedades', category: 'Video Slot', thumb: 'assets/slots/inferno_phoenix.png' },
    { id: 'golden_goal_nations', name: 'Golden Goal Nations', group: 'Novedades', category: 'Video Slot', thumb: 'assets/slots/golden_goal.png' },
    { id: 'steam_train_tycoon', name: 'Steam Train Tycoon', group: 'Novedades', category: 'Hold & Win', thumb: 'assets/slots/steam_train.png' },
    { id: 'witchs_wicked_wares', name: 'Witch\'s Wicked Wares', group: 'Novedades', category: 'Video Slot', thumb: 'assets/slots/witch_wicked.png' }
];

let currentRotation = 0;

function init() {
    renderCarousel();
    renderGrid(GAMES);
    
    // Cargar saldo real si existe
    const savedBalance = localStorage.getItem('arcade_credits');
    if(savedBalance) document.getElementById('balance').textContent = Number(savedBalance).toLocaleString();
}

function renderCarousel() {
    const carousel = document.getElementById('carousel3D');
    const angleStep = 360 / GAMES.length;
    const radius = 500;

    GAMES.forEach((g, i) => {
        const item = document.createElement('div');
        item.className = 'carousel-item';
        item.style.transform = `rotateY(${i * angleStep}deg) translateZ(${radius}px)`;
        item.onclick = () => playNewGame(g.id);
        item.innerHTML = `
            <img src="${g.thumb}" onerror="this.src='/assets/slots/default_slot.png'">
            <div class="item-info">
                <h3>${g.name}</h3>
                <p>${g.category}</p>
            </div>
        `;
        carousel.appendChild(item);
    });
}

function rotateCarousel(dir) {
    const carousel = document.getElementById('carousel3D');
    currentRotation -= dir * (360 / GAMES.length);
    carousel.style.transform = `rotateY(${currentRotation}deg)`;
}

function renderGrid(gamesList) {
    const grid = document.getElementById('gamesGrid');
    grid.innerHTML = '';
    gamesList.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => playNewGame(g.id);
        card.innerHTML = `
            <div class="card-art" style="background-image: url('${g.thumb}')">
                <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.8));"></div>
            </div>
            <div class="card-info">
                <div class="card-title">${g.name}</div>
                <div class="card-sub">${g.category}</div>
                <div style="margin-top: 10px;"><span class="tag-new">NUEVO</span></div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterGames(filter) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    if(filter === 'all') renderGrid(GAMES);
    else renderGrid(GAMES.filter(g => g.group === filter));
}

function playNewGame(id) {
    const overlay = document.getElementById('loadingOverlay');
    const progress = document.getElementById('loadProgress');
    overlay.style.display = 'flex';
    
    let p = 0;
    const interval = setInterval(() => {
        p += Math.random() * 30;
        if (p >= 100) {
            p = 100;
            clearInterval(interval);
            setTimeout(() => {
                window.location.href = `/${id}.html`;
            }, 200);
        }
        progress.style.width = p + '%';
    }, 100);
}

window.onload = init;
</script>
</body>
</html>
