<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASINO 3D LOBBY | Elite Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { 
    --gold: #f4c430; 
    --green: #00ff99;
    --neon-blue: #00d2ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html, body { 
    width: 100%; 
    height: 100vh; 
    overflow: hidden; 
    background: radial-gradient(circle at center, #1a1a2e 0%, #050a0f 100%); 
    color: #fff; 
    font-family: 'Rajdhani', sans-serif; 
}

/* Background FX */
.bg-fx { position: fixed; inset: 0; z-index: -1; opacity: 0.3; background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); }

.lobby-wrapper {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 0;
}

.lobby-header { text-align: center; }
.lobby-title { font-family: 'Bebas Neue'; font-size: 80px; color: var(--gold); text-shadow: 0 0 30px rgba(244, 196, 48, 0.5); letter-spacing: 8px; }
.lobby-subtitle { font-family: 'Orbitron'; font-size: 18px; color: var(--neon-blue); letter-spacing: 4px; }

/* 3D Carousel Stage */
.stage {
    perspective: 2000px;
    width: 100%;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.carousel-3d {
    width: 320px;
    height: 450px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
}

.carousel-item {
    position: absolute;
    width: 320px;
    height: 450px;
    background: #111;
    border: 3px solid var(--gold);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    backface-visibility: hidden;
    box-shadow: 0 10px 50px rgba(0,0,0,0.9);
    transition: all 0.5s ease;
}

.carousel-item:hover {
    border-color: var(--green);
    box-shadow: 0 0 30px var(--green);
}

.carousel-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
.carousel-item:hover img { transform: scale(1.05); }

.carousel-item .item-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.95));
    padding: 40px 20px 20px;
    text-align: center;
}

.carousel-item h3 { font-family: 'Bebas Neue'; font-size: 36px; color: var(--gold); margin-bottom: 5px; }
.carousel-item p { font-family: 'Orbitron'; font-size: 12px; color: #aaa; text-transform: uppercase; }

/* Controls */
.controls {
    display: flex;
    gap: 60px;
    align-items: center;
    margin-bottom: 20px;
}

.nav-btn {
    background: rgba(255,255,255,0.05);
    border: 2px solid var(--gold);
    color: var(--gold);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    font-size: 30px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.nav-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 30px var(--gold); transform: scale(1.1); }

.play-btn {
    padding: 15px 60px;
    background: var(--green);
    color: #000;
    font-family: 'Orbitron';
    font-weight: 900;
    font-size: 20px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 0 20px var(--green);
    transition: all 0.3s;
}
.play-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--green); }

.footer-info {
    width: 100%;
    padding: 20px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.5);
    border-top: 1px solid rgba(255,255,255,0.1);
}

.balance-display { font-family: 'Orbitron'; font-size: 24px; color: var(--green); }
.balance-display span { color: #fff; }

/* Loading Overlay */
#loadingOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.loading-text { font-family: 'Bebas Neue'; font-size: 60px; color: var(--gold); margin-bottom: 20px; }
.loading-bar { width: 400px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
.loading-progress { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }

</style>
</head>
<body>

<div class="bg-fx"></div>

<div class="lobby-wrapper">
    <div class="lobby-header">
        <div class="lobby-title">CASINO DEL PANA</div>
        <div class="lobby-subtitle">ELITE 3D INTERACTIVE EXPERIENCE</div>
    </div>

    <div class="stage">
        <div class="carousel-3d" id="carousel3D"></div>
    </div>

    <div class="controls">
        <button class="nav-btn" onclick="rotateCarousel(-1)">❮</button>
        <button class="play-btn" onclick="launchGame()">¡JUGAR AHORA!</button>
        <button class="nav-btn" onclick="rotateCarousel(1)">❯</button>
    </div>

    <div class="footer-info">
        <div class="balance-display">SALDO: <span id="balance">100,000</span>€</div>
        <div style="font-family: 'Orbitron'; color: #555;">© 2026 PREMIUM CASINO</div>
    </div>
</div>

<div id="loadingOverlay">
    <div class="loading-text">PREPARANDO MESA...</div>
    <div class="loading-bar"><div class="loading-progress" id="loadProgress"></div></div>
</div>

<script>
const GAMES = [
    { id: 'triad_pigs_olympus', name: 'Triad Pigs Olympus', category: 'Video Slot', thumb: 'assets/slots/triad_pigs_epic.png' },
    { id: 'penalty_pro_championship', name: 'Penalty Pro', category: 'Arcade', thumb: 'assets/slots/penalty_pro.png' },
    { id: 'jolly_pigs_christmas', name: 'Jolly Pigs', category: 'Video Slot', thumb: 'assets/slots/jolly_pigs.png' },
    { id: 'gold_mine_blast', name: 'Gold Mine', category: 'Video Slot', thumb: 'assets/slots/gold_mine.png' },
    { id: 'inferno_phoenix_blaze', name: 'Inferno Phoenix', category: 'Video Slot', thumb: 'assets/slots/inferno_phoenix.png' },
    { id: 'golden_goal_nations', name: 'Golden Goal', category: 'Video Slot', thumb: 'assets/slots/golden_goal.png' },
    { id: 'steam_train_tycoon', name: 'Steam Train', category: 'Hold & Win', thumb: 'assets/slots/steam_train.png' },
    { id: 'witchs_wicked_wares', name: 'Witch\'s Wicked', category: 'Video Slot', thumb: 'assets/slots/witch_wicked.png' }
];

let currentRotation = 0;
let currentIndex = 0;

function init() {
    renderCarousel();
    updateBalance();
}

function renderCarousel() {
    const carousel = document.getElementById('carousel3D');
    const angleStep = 360 / GAMES.length;
    const radius = 600; // Radio más grande para el 3D

    GAMES.forEach((g, i) => {
        const item = document.createElement('div');
        item.className = 'carousel-item';
        item.style.transform = `rotateY(${i * angleStep}deg) translateZ(${radius}px)`;
        item.onclick = () => {
            // Rotar hasta este elemento si se hace clic
            const diff = i - currentIndex;
            rotateCarousel(diff);
        };
        item.innerHTML = `
            <img src="${g.thumb}" onerror="this.src='assets/slots/default_slot.png'">
            <div class="item-info">
                <h3>${g.name}</h3>
                <p>${g.category}</p>
            </div>
        `;
        carousel.appendChild(item);
    });
}

function rotateCarousel(dir) {
    const carousel = document.getElementById('carousel3D');
    currentIndex = (currentIndex + dir + GAMES.length) % GAMES.length;
    currentRotation -= dir * (360 / GAMES.length);
    carousel.style.transform = `rotateY(${currentRotation}deg)`;
}

function launchGame() {
    const gameId = GAMES[currentIndex].id;
    const overlay = document.getElementById('loadingOverlay');
    const progress = document.getElementById('loadProgress');
    overlay.style.display = 'flex';
    
    let p = 0;
    const interval = setInterval(() => {
        p += Math.random() * 20;
        if (p >= 100) {
            p = 100;
            clearInterval(interval);
            setTimeout(() => {
                window.location.href = `/${gameId}.html`;
            }, 300);
        }
        progress.style.width = p + '%';
    }, 80);
}

function updateBalance() {
    const savedBalance = localStorage.getItem('arcade_credits');
    if(savedBalance) document.getElementById('balance').textContent = Number(savedBalance).toLocaleString();
}

window.onload = init;
</script>
</body>
</html>
