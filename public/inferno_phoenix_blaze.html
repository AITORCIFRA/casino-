<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOT MACHINE - Premium Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/js/wallet.js"></script>
<style>
:root {
    --gold: #f4c430;
    --neon-green: #00ff99;
    --neon-blue: #00d2ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #050a0f;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.game-header {
    height: 60px;
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 30px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.back-btn {
    color: #fff;
    text-decoration: none;
    font-family: 'Orbitron';
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.slot-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at center, #1a3a4a 0%, #050a0f 100%);
}

.game-title {
    font-family: 'Orbitron';
    font-size: 32px;
    color: var(--gold);
    text-shadow: 0 0 20px var(--gold);
    margin-bottom: 20px;
}

.reels-wrapper {
    background: #111;
    border: 8px solid #333;
    border-radius: 20px;
    display: flex;
    gap: 10px;
    padding: 15px;
    box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.9);
    position: relative;
}

.reel {
    width: 120px;
    height: 360px;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
}

.symbol {
    height: 113px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 5px;
    transition: transform 0.1s;
}

.win-line {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--neon-green);
    box-shadow: 0 0 15px var(--neon-green);
    transform: translateY(-50%);
    display: none;
    z-index: 10;
}

.controls {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 30px;
    background: rgba(0,0,0,0.5);
    padding: 20px 40px;
    border-radius: 50px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.bet-control {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.bet-label { font-size: 12px; color: #888; text-transform: uppercase; }
.bet-value { font-family: 'Orbitron'; font-size: 24px; color: #fff; }

.spin-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), #d4a520);
    border: 5px solid rgba(255, 255, 255, 0.2);
    color: #000;
    font-family: 'Orbitron';
    font-weight: 900;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(244, 196, 48, 0.4);
    transition: all 0.2s;
}

.spin-btn:hover:not(:disabled) {
    transform: scale(1.1);
    box-shadow: 0 0 50px rgba(244, 196, 48, 0.6);
}

.spin-btn:disabled {
    filter: grayscale(1);
    opacity: 0.5;
    cursor: not-allowed;
}

.result-msg {
    margin-top: 20px;
    font-family: 'Orbitron';
    font-size: 20px;
    height: 30px;
    color: var(--neon-green);
    text-shadow: 0 0 10px var(--neon-green);
}

@keyframes spin {
    0% { transform: translateY(0); }
    100% { transform: translateY(-1000px); }
}

.spinning {
    animation: spin 0.5s linear infinite;
}
</style>
</head>
<body>

<div class="game-header">
    <a href="/lobby.html" class="back-btn">← VOLVER AL LOBBY</a>
    <div id="balanceDisplay" style="font-family: 'Orbitron'; color: var(--neon-green);">SALDO: $0</div>
</div>

<div class="slot-container">
    <h1 id="gameTitle" class="game-title">CARGANDO JUEGO...</h1>
    
    <div class="reels-wrapper">
        <div class="win-line" id="winLine"></div>
        <div class="reel" id="reel0"></div>
        <div class="reel" id="reel1"></div>
        <div class="reel" id="reel2"></div>
        <div class="reel" id="reel3"></div>
        <div class="reel" id="reel4"></div>
    </div>

    <div id="resultMsg" class="result-msg"></div>

    <div class="controls">
        <div class="bet-control">
            <span class="bet-label">APUESTA</span>
            <div class="bet-value">$<span id="betValue">10</span></div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button onclick="changeBet(-10)" class="tab" style="padding: 5px 15px;">-</button>
            <button onclick="changeBet(10)" class="tab" style="padding: 5px 15px;">+</button>
        </div>

        <button id="spinBtn" class="spin-btn" onclick="spin()">SPIN</button>
        
        <div class="bet-control">
            <span class="bet-label">GANANCIA</span>
            <div class="bet-value" id="winDisplay">$0</div>
        </div>
    </div>
</div>

<script>
let currentBet = 10;
let isSpinning = false;
let gameId = new URLSearchParams(window.location.search).get('game_id');
let playerBalance = 0;

async function init() {
    if (!gameId) {
        window.location.href = '/lobby.html';
        return;
    }

    try {
        const res = await fetch(`/api/games/new/info/${gameId}`);
        const info = await res.json();
        document.getElementById('gameTitle').textContent = info.name;
        
        playerBalance = await WalletAPI.getBalance();
        updateBalance();
        
        // Inicializar rodillos con símbolos aleatorios
        const symbols = ["🍒", "🍋", "🍇", "🔔", "⭐", "💎", "7️⃣"];
        for(let i=0; i<5; i++) {
            const reel = document.getElementById(`reel${i}`);
            reel.innerHTML = '';
            for(let j=0; j<10; j++) {
                const sym = document.createElement('div');
                sym.className = 'symbol';
                sym.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                reel.appendChild(sym);
            }
        }
    } catch (e) {
        console.error(e);
    }
}

function updateBalance() {
    document.getElementById('balanceDisplay').textContent = `SALDO: $${playerBalance.toLocaleString()}`;
}

function changeBet(val) {
    if (isSpinning) return;
    currentBet = Math.max(10, Math.min(100, currentBet + val));
    document.getElementById('betValue').textContent = currentBet;
}

async function spin() {
    if (isSpinning || playerBalance < currentBet) return;
    
    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('winLine').style.display = 'none';
    document.getElementById('resultMsg').textContent = '';
    document.getElementById('winDisplay').textContent = '$0';

    // Animación de giro
    for(let i=0; i<5; i++) {
        const reel = document.getElementById(`reel${i}`);
        reel.classList.add('spinning');
    }

    try {
        const response = await fetch('/api/games/new/spin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                player_id: "user_1",
                bet: currentBet,
                game_id: gameId
            })
        });
        
        const result = await response.json();
        
        // Simular tiempo de giro
        setTimeout(() => {
            stopSpinning(result);
        }, 1500);

    } catch (e) {
        console.error(e);
        stopSpinning(null);
    }
}

function stopSpinning(result) {
    for(let i=0; i<5; i++) {
        const reel = document.getElementById(`reel${i}`);
        reel.classList.remove('spinning');
        
        if (result) {
            // Actualizar símbolos del resultado
            const reelSymbols = result.reels[i];
            const symbolsElements = reel.querySelectorAll('.symbol');
            symbolsElements[0].textContent = reelSymbols[0];
            symbolsElements[1].textContent = reelSymbols[1];
            symbolsElements[2].textContent = reelSymbols[2];
        }
    }

    if (result && result.win > 0) {
        playerBalance += result.win;
        document.getElementById('winLine').style.display = 'block';
        document.getElementById('resultMsg').textContent = result.message;
        document.getElementById('winDisplay').textContent = `$${result.win.toLocaleString()}`;
        updateBalance();
    } else {
        playerBalance -= currentBet;
        updateBalance();
    }

    isSpinning = false;
    document.getElementById('spinBtn').disabled = false;
}

window.onload = init;
</script>

</body>
</html>
