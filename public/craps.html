<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CRAPS ULTIMATE 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/js/wallet.js"></script>
<script src="/js/curtain-effect.js"></script>
<script src="/animations.js"></script>
<style>
:root { --felt-blue: #1a4d6e; --gold: #c9a84c; --border: #3a8ebf; }
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body { background: #050a0f; color: #fff; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(0,0,0,0.5); border-bottom: 2px solid var(--gold); z-index: 100; }
.title { font-family: 'Orbitron'; font-size: 20px; color: var(--gold); font-weight: 900; }
.credits { font-family: 'Orbitron'; color: #00ff99; font-size: 18px; }

/* TABLE LAYOUT */
.game-container { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; perspective: 1500px; padding: 20px; }

.craps-table { 
    width: 95%; 
    max-width: 1100px; 
    height: 550px; 
    background: var(--felt-blue); 
    border: 12px solid #4a2e1b; 
    border-radius: 40px; 
    position: relative; 
    box-shadow: inset 0 0 100px rgba(0,0,0,0.6), 0 30px 60px rgba(0,0,0,0.8);
    transform: rotateX(20deg);
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
    padding: 15px;
    gap: 10px;
}

/* AREAS DE APUESTA */
.bet-area { border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
.bet-area:hover { background: rgba(255,255,255,0.05); }
.bet-area.selected { background: rgba(201, 168, 76, 0.3); border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }
.bet-label { font-family: 'Orbitron'; font-size: 10px; font-weight: 900; letter-spacing: 1px; color: rgba(255,255,255,0.8); }
.bet-payout { font-size: 9px; color: var(--gold); margin-top: 2px; }

/* GRID IZQUIERDA (HARDWAYS) */
.left-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

/* CENTRO (MAIN BOARD) */
.center-board { display: grid; grid-template-rows: 1fr 2fr 1fr; gap: 5px; }
.numbers-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.field-area { background: rgba(0,0,0,0.2); border: 2px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.field-nums { font-family: 'Orbitron'; font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 5px; }

/* DERECHA (ONE ROLL BETS) */
.right-grid { display: grid; grid-template-rows: repeat(4, 1fr); gap: 5px; }

/* DICE 3D SYSTEM */
.dice-overlay { 
    position: absolute; 
    inset: 0; 
    z-index: 1000; 
    pointer-events: none; 
    display: none; 
    align-items: center; 
    justify-content: center;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(2px);
}
.dice-overlay.active { display: flex; }

.dice-scene { width: 400px; height: 400px; position: relative; perspective: 1000px; transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.dice-overlay.active .dice-scene { transform: scale(1.5); }

.die-3d { width: 100px; height: 100px; position: absolute; transform-style: preserve-3d; transition: transform 2s cubic-bezier(0.2, 0.8, 0.3, 1); }
#die1 { left: 50px; top: 150px; }
#die2 { right: 50px; top: 150px; }

.die-face { 
    position: absolute; width: 100px; height: 100px; background: #fff; border: 2px solid #ddd; border-radius: 15px; 
    display: flex; align-items: center; justify-content: center; font-size: 60px; color: #cc0000; box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
}
.face-1 { transform: rotateY(0deg) translateZ(50px); }
.face-2 { transform: rotateY(90deg) translateZ(50px); }
.face-3 { transform: rotateX(90deg) translateZ(50px); }
.face-4 { transform: rotateX(-90deg) translateZ(50px); }
.face-5 { transform: rotateY(-90deg) translateZ(50px); }
.face-6 { transform: rotateY(180deg) translateZ(50px); }

/* CONTROLS */
.footer-controls { background: #111; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 30px; border-top: 2px solid var(--gold); }
.chip-selector { display: flex; gap: 10px; }
.chip { width: 45px; height: 45px; border-radius: 50%; border: 3px dashed #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; transition: 0.2s; font-size: 12px; }
.chip:hover { transform: translateY(-5px) scale(1.1); }
.chip.selected { border-style: solid; box-shadow: 0 0 15px #fff; }

.btn-roll { 
    background: linear-gradient(135deg, var(--gold), #ffe080); 
    color: #000; border: none; padding: 12px 60px; border-radius: 30px; 
    font-family: 'Orbitron'; font-weight: 900; font-size: 20px; cursor: pointer;
    box-shadow: 0 5px 20px rgba(201,168,76,0.4);
}
.btn-roll:disabled { opacity: 0.5; filter: grayscale(1); }

.log-msg { position: absolute; bottom: 80px; width: 100%; text-align: center; font-family: 'Orbitron'; font-size: 22px; color: #fff; text-shadow: 0 0 10px #000; pointer-events: none; }
</style>
</head>
<body>

<div class="header">
    <div class="title">🎲 CRAPS ELITE 3D</div>
    <div class="credits">SALDO: <span id="balance">0</span></div>
</div>

<div class="game-container">
    <div class="craps-table">
        <!-- LEFT: HARDWAYS -->
        <div class="left-grid">
            <div class="bet-area" onclick="selectBet('hard4', this)">
                <div class="bet-label">HARD 4</div>
                <div class="bet-payout">7:1</div>
            </div>
            <div class="bet-area" onclick="selectBet('hard6', this)">
                <div class="bet-label">HARD 6</div>
                <div class="bet-payout">9:1</div>
            </div>
            <div class="bet-area" onclick="selectBet('hard8', this)">
                <div class="bet-label">HARD 8</div>
                <div class="bet-payout">9:1</div>
            </div>
            <div class="bet-area" onclick="selectBet('hard10', this)">
                <div class="bet-label">HARD 10</div>
                <div class="bet-payout">7:1</div>
            </div>
        </div>

        <!-- CENTER: MAIN BOARD -->
        <div class="center-board">
            <div class="numbers-row">
                <div class="bet-area" onclick="selectBet('num4', this)"><div class="bet-label">4</div></div>
                <div class="bet-area" onclick="selectBet('num5', this)"><div class="bet-label">5</div></div>
                <div class="bet-area" onclick="selectBet('num6', this)"><div class="bet-label">SIX</div></div>
                <div class="bet-area" onclick="selectBet('num8', this)"><div class="bet-label">8</div></div>
                <div class="bet-area" onclick="selectBet('num9', this)"><div class="bet-label">NINE</div></div>
                <div class="bet-area" onclick="selectBet('num10', this)"><div class="bet-label">10</div></div>
            </div>
            <div class="field-area bet-area" onclick="selectBet('field', this)">
                <div class="bet-label">FIELD</div>
                <div class="field-nums">2 3 4 9 10 11 12</div>
                <div class="bet-payout">2:1 (2,12 PAGA 3:1)</div>
            </div>
            <div class="bet-area" onclick="selectBet('pass', this)" style="border-width: 3px; border-color: var(--gold);">
                <div class="bet-label" style="font-size: 20px; color: var(--gold);">PASS LINE</div>
                <div class="bet-payout">PAGA 1:1</div>
            </div>
        </div>

        <!-- RIGHT: ONE ROLL BETS -->
        <div class="right-grid">
            <div class="bet-area" onclick="selectBet('any7', this)">
                <div class="bet-label">ANY SEVEN</div>
                <div class="bet-payout">4:1</div>
            </div>
            <div class="bet-area" onclick="selectBet('craps', this)">
                <div class="bet-label">ANY CRAPS</div>
                <div class="bet-payout">7:1</div>
            </div>
            <div class="bet-area" onclick="selectBet('yo11', this)">
                <div class="bet-label">YO 11</div>
                <div class="bet-payout">15:1</div>
            </div>
            <div class="bet-area" onclick="selectBet('boxcars', this)">
                <div class="bet-label">BOXCARS (12)</div>
                <div class="bet-payout">30:1</div>
            </div>
        </div>
    </div>

    <div class="log-msg" id="log">¡ELIGE TU APUESTA Y LANZA!</div>

    <div class="dice-overlay" id="diceOverlay">
        <div class="dice-scene">
            <div class="die-3d" id="die1">
                <div class="die-face face-1">⚀</div>
                <div class="die-face face-2">⚁</div>
                <div class="die-face face-3">⚂</div>
                <div class="die-face face-4">⚃</div>
                <div class="die-face face-5">⚄</div>
                <div class="die-face face-6">⚅</div>
            </div>
            <div class="die-3d" id="die2">
                <div class="die-face face-1">⚀</div>
                <div class="die-face face-2">⚁</div>
                <div class="die-face face-3">⚂</div>
                <div class="die-face face-4">⚃</div>
                <div class="die-face face-5">⚄</div>
                <div class="die-face face-6">⚅</div>
            </div>
        </div>
    </div>
</div>

<div class="footer-controls">
    <div class="chip-selector">
        <div class="chip" style="background:#ef4444" onclick="setChip(10, this)">10</div>
        <div class="chip" style="background:#3b82f6" onclick="setChip(50, this)">50</div>
        <div class="chip selected" style="background:#10b981" onclick="setChip(100, this)">100</div>
        <div class="chip" style="background:#f59e0b" onclick="setChip(500, this)">500</div>
        <div class="chip" style="background:#8b5cf6" onclick="setChip(1000, this)">1K</div>
    </div>
    <button class="btn-roll" id="rollBtn" onclick="rollDice()">LANZAR DADOS</button>
</div>

<script>
let balance = 0;
let currentChip = 100;
let selectedBet = 'pass';
let isRolling = false;
const winAnim = new WinAnimation();

async function init() {
    balance = await WalletAPI.getBalance();
    updateUI();
}

function updateUI() {
    document.getElementById('balance').textContent = balance.toLocaleString();
    window.parent.postMessage({ type: 'credits', value: balance }, '*');
}

function setChip(val, el) {
    if (isRolling) return;
    currentChip = val;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
}

function selectBet(type, el) {
    if (isRolling) return;
    selectedBet = type;
    document.querySelectorAll('.bet-area').forEach(a => a.classList.remove('selected'));
    el.classList.add('selected');
}

async function rollDice() {
    if (isRolling) return;
    if (balance < currentChip) { WalletAPI.openShop(); return; }

    isRolling = true;
    document.getElementById('rollBtn').disabled = true;
    document.getElementById('log').textContent = "¡LANZANDO DADOS!";

    try {
        const res = await fetch('/api/games/craps/roll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: WalletAPI.getUsername(),
                bet_amount: currentChip,
                bet_type: selectedBet
            })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        // Iniciar animación 3D
        const overlay = document.getElementById('diceOverlay');
        overlay.classList.add('active');
        
        const d1 = document.getElementById('die1');
        const d2 = document.getElementById('die2');
        
        // Rotaciones aleatorias previas para el efecto de giro
        const rotX1 = Math.floor(Math.random() * 5 + 5) * 360;
        const rotY1 = Math.floor(Math.random() * 5 + 5) * 360;
        const rotX2 = Math.floor(Math.random() * 5 + 5) * 360;
        const rotY2 = Math.floor(Math.random() * 5 + 5) * 360;

        // Mapeo de caras a rotaciones
        const faceRots = {
            1: [0, 0],
            2: [0, -90],
            3: [-90, 0],
            4: [90, 0],
            5: [0, 90],
            6: [0, 180]
        };

        const f1 = faceRots[data.dice[0]];
        const f2 = faceRots[data.dice[1]];

        d1.style.transform = `rotateX(${rotX1 + f1[0]}deg) rotateY(${rotY1 + f1[1]}deg)`;
        d2.style.transform = `rotateX(${rotX2 + f2[0]}deg) rotateY(${rotY2 + f2[1]}deg)`;

        setTimeout(() => {
            document.getElementById('log').textContent = data.message;
            balance = data.new_balance;
            updateUI();
            
            if (data.win_amount > currentChip) {
                winAnim.fountainEffect(data.win_amount);
            }

            setTimeout(() => {
                overlay.classList.remove('active');
                d1.style.transform = '';
                d2.style.transform = '';
                isRolling = false;
                document.getElementById('rollBtn').disabled = false;
            }, 2000);
        }, 2200);

    } catch (e) {
        console.error(e);
        isRolling = false;
        document.getElementById('rollBtn').disabled = false;
        document.getElementById('log').textContent = "ERROR EN EL SERVIDOR";
    }
}

init();
window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'credits_updated') {
        balance = Math.floor(event.data.balance);
        updateUI();
    }
});
</script>
</body>
</html>
