<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASINO GAME | Casino del Pana</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050a0f; color: #fff; font-family: 'Rajdhani', sans-serif; text-align: center; padding-top: 50px; }
        .back-btn { color: #f4c430; text-decoration: none; border: 1px solid #f4c430; padding: 10px 20px; border-radius: 5px; }
        .game-area { margin-top: 100px; padding: 50px; border: 2px solid #333; display: inline-block; border-radius: 20px; background: #111; }
        h1 { font-family: 'Orbitron'; color: #f4c430; margin-bottom: 20px; }
    </style>
</head>
<body>
    <a href="/lobby.html" class="back-btn">← VOLVER AL LOBBY</a>
    <div class="game-area">
        <h1 id="gameTitle">GAME NAME</h1>
        <p>Este juego está en mantenimiento o es una versión clásica.</p>
        <div style="margin-top: 30px; font-size: 24px;">SALDO: <span id="balance">100,000</span>€</div>
        <div style="margin-top: 20px;">
            APUESTA: <span id="betValue">10€</span>
            <button style="padding: 10px 30px; background: #f4c430; border: none; font-weight: bold; cursor: pointer; margin-left: 20px;">GIRAR</button>
        </div>
    </div>
    <script>
        let balance = Number(localStorage.getItem('arcade_credits') || 100000);
        document.getElementById('balance').textContent = balance.toLocaleString();
        const urlParams = new URLSearchParams(window.location.search);
        const title = window.location.pathname.split('/').pop().replace('.html', '').replace(/_/g, ' ').toUpperCase();
        document.getElementById('gameTitle').textContent = title;
    </script>
</body>
</html>
