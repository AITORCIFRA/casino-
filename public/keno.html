<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Keno Turbo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<script src="/js/wallet.js"></script>
<script src="/animations.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--neon:#00D4FF;--gold:#C9A84C;--green:#00FF88;--red:#FF3366;--bg:#020d14;--font-d:'Bebas Neue',sans-serif;--font-u:'Orbitron',sans-serif;--font-b:'Rajdhani',sans-serif}
body{background:radial-gradient(ellipse at 50% 0%,#001f30,var(--bg));color:#fff;font-family:var(--font-b);min-height:100vh;padding:1rem;display:flex;flex-direction:column;align-items:center}
h1{font-family:var(--font-d);font-size:2.2rem;letter-spacing:.15em;color:var(--neon);text-shadow:0 0 30px var(--neon);margin-bottom:.75rem;animation:title-glow 2s ease-in-out infinite}
@keyframes title-glow{0%,100%{text-shadow:0 0 30px var(--neon)}50%{text-shadow:0 0 60px var(--neon), 0 0 100px var(--neon)}}
.stats-row{display:flex;gap:1.5rem;margin-bottom:.75rem;font-family:var(--font-u);font-size:10px}
.stat{text-align:center;animation:stat-pulse 1.5s ease-in-out infinite}.stat-lbl{color:rgba(255,255,255,.4);font-size:8px;letter-spacing:.15em}.stat-val{font-size:1.1rem}
.cval{color:var(--green);text-shadow:0 0 8px var(--green)}
.bval{color:var(--gold)}
.wval{color:var(--neon)}
@keyframes stat-pulse{0%,100%{opacity:1}50%{opacity:0.7}}
.keno-board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:600px;width:100%;margin-bottom:.75rem}
.kball{width:100%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:var(--font-u);font-size:11px;cursor:pointer;transition:all .15s;user-select:none;position:relative}
.kball:hover{background:rgba(0,212,255,.1);border-color:var(--neon)}
.kball.picked{background:radial-gradient(circle at 35% 35%,rgba(0,212,255,.4),rgba(0,100,150,.6));border-color:var(--neon);color:var(--neon);box-shadow:0 0 12px var(--neon);transform:scale(1.08);animation:pick-bounce .3s ease}
@keyframes pick-bounce{0%,100%{transform:scale(1.08)}50%{transform:scale(1.15)}}
.kball.drawn{background:radial-gradient(circle at 35% 35%,rgba(201,168,76,.5),rgba(100,60,0,.6));border-color:var(--gold);color:var(--gold);box-shadow:0 0 16px var(--gold)}
.kball.match{background:radial-gradient(circle at 35% 35%,rgba(0,255,136,.5),rgba(0,100,50,.6));border-color:var(--green);color:var(--green);box-shadow:0 0 20px var(--green);animation:matchPop .5s ease}
@keyframes matchPop{0%{transform:scale(.8)}60%{transform:scale(1.3)}100%{transform:scale(1.1)}}
.draw-display{display:flex;flex-wrap:wrap;gap:4px;max-width:600px;width:100%;min-height:44px;background:rgba(0,0,0,.4);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:6px;margin-bottom:.75rem;align-items:center}
.drawn-ball{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-u);font-size:10px;font-weight:700;border:1.5px solid;animation:ballIn .25s cubic-bezier(.34,1.56,.64,1) both}
@keyframes ballIn{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
.db-normal{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold)}
.db-hit{background:rgba(0,255,136,.2);border-color:var(--green);color:var(--green);box-shadow:0 0 10px var(--green)}
.controls{display:flex;gap:.6rem;margin-bottom:.5rem;flex-wrap:wrap;justify-content:center}
.ctrl{font-family:var(--font-u);font-size:10px;letter-spacing:.1em;padding:.45rem .9rem;border:none;border-radius:6px;cursor:pointer;transition:all .15s}
.ctrl:active{transform:scale(.96)}
.btn-play{background:linear-gradient(90deg,#0E7490,#06B6D4);color:#fff;font-size:13px;padding:.55rem 2rem;box-shadow:0 0 20px rgba(6,182,212,.3)}
.btn-play:hover{filter:brightness(1.1);box-shadow:0 0 30px rgba(6,182,212,.6)}
.btn-play:disabled{opacity:.4;cursor:not-allowed}
.btn-clear{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6)}
.btn-quick{background:rgba(201,168,76,.1);border:1px solid var(--gold);color:var(--gold)}
.bet-ctrl{background:rgba(0,212,255,.08);border:1px solid var(--neon);color:var(--neon)}
.info-row{font-family:var(--font-u);font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.3);text-align:center;margin-bottom:.5rem}
.result-msg{font-family:var(--font-d);font-size:1.8rem;letter-spacing:.1em;text-align:center;min-height:2.5rem;text-shadow:0 0 20px currentColor;animation:result-pop .5s cubic-bezier(.16,1,.3,1)}
@keyframes result-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:600px;width:100%;margin-top:.5rem}
.pt-cell{background:rgba(255,255,255,.04);border-radius:4px;padding:3px;text-align:center;font-size:9px;font-family:var(--font-u);color:var(--gold)}
.pt-cell span{display:block;color:rgba(255,255,255,.5);font-size:8px;margin-bottom:1px}
</style>
</head>
<body>
<h1>KENO TURBO</h1>
<div class="stats-row">
  <div class="stat"><div class="stat-lbl">CRÉDITOS</div><div class="stat-val cval" id="cred">0</div></div>
  <div class="stat"><div class="stat-lbl">APUESTA</div><div class="stat-val bval" id="betD">10</div></div>
  <div class="stat"><div class="stat-lbl">ELEGIDOS</div><div class="stat-val" id="pickedCount" style="color:var(--neon)">0 / 10</div></div>
  <div class="stat"><div class="stat-lbl">ACIERTOS</div><div class="stat-val wval" id="hitsD">-</div></div>
</div>
<div class="keno-board" id="board"></div>
<div class="draw-display" id="drawDisplay"></div>
<div class="result-msg" id="resultMsg"></div>
<div class="controls">
  <button class="ctrl bet-ctrl" onclick="chBet(-1)">BET -</button>
  <button class="ctrl btn-quick" onclick="quickPick()">RÁPIDO</button>
  <button class="ctrl btn-clear" onclick="clearPicked()">BORRAR</button>
  <button class="ctrl btn-play" id="playBtn" onclick="playKeno()">JUGAR</button>
  <button class="ctrl bet-ctrl" onclick="chBet(1)">BET +</button>
</div>
<div class="info-row">ELIGE HASTA 10 NÚMEROS · 20 BOLAS SE EXTRAEN</div>
<div class="pt" id="pt"></div>

<script>
const params = new URLSearchParams(window.location.search);
const MIN_BET = Math.max(1, parseInt(params.get('min_bet')) || 1);
let MAX_BET = parseInt(params.get('max_bet'));
if (isNaN(MAX_BET) || MAX_BET < MIN_BET) MAX_BET = MIN_BET * 1000;

function buildBetOptions(min, max) {
  const base = [1,2,5,10,25,50,100];
  const opts = [...new Set(base)];
  while (opts[opts.length - 1] < max) {
    const last = opts[opts.length - 1];
    let next = last < 100 ? last * 2 : last < 1000 ? last * 2 : last < 10000 ? last * 5 : last * 10;
    if (next <= last) next = last + Math.max(1, Math.floor(last * 0.1));
    opts.push(next);
    if (opts.length > 50) break;
  }
  const filtered = opts.filter(v => v >= min && v <= max);
  if (filtered[0] !== min) filtered.unshift(min);
  if (filtered[filtered.length - 1] !== max) filtered.push(max);
  return [...new Set(filtered)].sort((a,b)=>a-b);
}
const BETS = buildBetOptions(MIN_BET, MAX_BET);

function clampBetIdx() {
  betIdx = Math.max(0, Math.min(BETS.length - 1, betIdx));
  while (betIdx > 0 && BETS[betIdx] > MAX_BET) betIdx--;
  while (betIdx < BETS.length - 1 && BETS[betIdx] < MIN_BET) betIdx++;
  if (BETS[betIdx] > MAX_BET) betIdx = BETS.length - 1;
}

betIdx = BETS.findIndex(b => b >= MIN_BET);
if (betIdx === -1) betIdx = BETS.length - 1;
clampBetIdx();

const PAY_TABLE = {
  1:  {1:3}, 2:  {2:10, 1:1}, 3:  {3:25, 2:2}, 4:  {4:80, 3:5, 2:1},
  5:  {5:200, 4:15, 3:3}, 6:  {6:500, 5:50, 4:8, 3:1}, 7:  {7:1500, 6:100, 5:20, 4:3},
  8:  {8:5000, 7:500, 6:80, 5:10, 4:2}, 9:  {9:8000, 8:1000, 7:150, 6:20, 5:4},
  10: {10:10000, 9:2000, 8:300, 7:50, 6:10, 5:2},
};

let credits=0, betIdx=3, picked=new Set(), playing=false;
const winAnim = new WinAnimation();

async function init() {
  credits = await WalletAPI.getBalance();
  updateUI();
  
  // Escuchar actualizaciones de créditos desde el lobby
  window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'credits_updated') {
      credits = Math.floor(event.data.balance);
      updateUI();
    }
  });
}

const board = document.getElementById('board');
for(let i=1;i<=80;i++){
  const d=document.createElement('div');
  d.className='kball'; d.textContent=i; d.id='k'+i;
  d.onclick=()=>togglePick(i);
  board.appendChild(d);
}

function togglePick(n) {
  if(playing) return;
  if(picked.has(n)){
    picked.delete(n);
    document.getElementById('k'+n).classList.remove('picked');
  } else {
    if(picked.size>=10) return;
    picked.add(n);
    document.getElementById('k'+n).classList.add('picked');
  }
  document.getElementById('pickedCount').textContent=picked.size+' / 10';
  buildPT();
}

function clearPicked() {
  if(playing) return;
  picked.forEach(n=>document.getElementById('k'+n).classList.remove('picked'));
  picked.clear();
  document.getElementById('pickedCount').textContent='0 / 10';
  document.getElementById('drawDisplay').innerHTML='';
  document.getElementById('resultMsg').textContent='';
  document.getElementById('hitsD').textContent='-';
  buildPT();
  for(let i=1;i<=80;i++) document.getElementById('k'+i).className='kball';
}

function quickPick() {
  if(playing) return;
  clearPicked();
  const nums=Array.from({length:80},(_,i)=>i+1);
  for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]];}
  nums.slice(0,10).forEach(n=>{ picked.add(n); document.getElementById('k'+n).classList.add('picked'); });
  document.getElementById('pickedCount').textContent='10 / 10';
  buildPT();
}

function chBet(d) {
  if(playing) return;
  betIdx=Math.max(0,Math.min(BETS.length-1,betIdx+d));
  clampBetIdx();
  document.getElementById('betD').textContent=BETS[betIdx];
}

async function playKeno() {
  if(playing||picked.size<1) return;
  const bet=BETS[betIdx];
  if(credits<bet) { WalletAPI.openShop(); return; }
  
  playing=true;
  document.getElementById('playBtn').disabled=true;
  for(let i=1;i<=80;i++) document.getElementById('k'+i).classList.remove('drawn','match');
  document.getElementById('drawDisplay').innerHTML='';

  try {
    const res = await fetch('/api/games/keno/play', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: WalletAPI.getUsername(), numbers: Array.from(picked), bet: bet })
    });
    const data = await res.json();
    if(!res.ok) { if(res.status===402) WalletAPI.openShop(); throw new Error(data.detail); }
    
    const drawn = data.winning_numbers;
    const win = data.win_amount;
    credits = data.new_balance;
    WalletAPI.cacheBalance(credits);

    let hits = 0;
    const dd=document.getElementById('drawDisplay');
    for(let idx=0;idx<drawn.length;idx++){
      const n=drawn[idx];
      const isHit=picked.has(n);
      if(isHit) hits++;
      document.getElementById('k'+n).classList.add(isHit?'match':'drawn');
      const ball=document.createElement('div');
      ball.className='drawn-ball '+(isHit?'db-hit':'db-normal');
      ball.textContent=n;
      dd.appendChild(ball);
      await new Promise(r=>setTimeout(r, 80));
    }

    document.getElementById('hitsD').textContent=hits;
    const msg=document.getElementById('resultMsg');
    msg.style.color = win > 0 ? '#00FF88' : 'rgba(255,255,255,.4)';
    msg.textContent = win > 0 ? `¡GANASTE +${win}!` : 'Sin premio';
    
    // Animaciones ludópata según el premio
    if(win >= bet * 100) {
      winAnim.jackpot(win);
    } else if(win >= bet * 10) {
      winAnim.bigWin(win);
    } else if(win > 0) {
      winAnim.smallWin(win);
    }
    
    updateUI();
  } catch (e) { console.error(e); }
  playing=false;
  document.getElementById('playBtn').disabled=false;
}

function updateUI(){ document.getElementById('cred').textContent=credits.toLocaleString(); }
function buildPT() {
  const pt = document.getElementById('pt'); pt.innerHTML='';
  const p = PAY_TABLE[Math.max(1,picked.size)];
  for(const [h, m] of Object.entries(p)){
    const d=document.createElement('div'); d.className='pt-cell';
    d.innerHTML=`<span>${h} ACIERTOS</span>×${m}`; pt.appendChild(d);
  }
}

window.addEventListener('walletUpdated', (e) => { credits = e.detail.balance; updateUI(); });
init();
</script>
</body>
</html>
