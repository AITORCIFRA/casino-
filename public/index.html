<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE PREMIUM — Cyber Casino Cloud 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Rajdhani', sans-serif;
  background: linear-gradient(-45deg, #050508, #120626, #091526, #020204);
  background-size: 400% 400%;
  animation: gradientBG 14s ease infinite;
  color: #FFF; overflow: hidden; user-select: none;
}
@keyframes gradientBG { 0% { background-position:0% 50% } 50% { background-position:100% 50% } 100% { background-position:0% 50% } }

.bg-glow { position: absolute; border-radius: 50%; filter: blur(140px); z-index: 0; opacity: 0.4; pointer-events: none; }
.glow1 { width: 40vw; height: 40vw; background: rgba(0, 255, 153, 0.2); top: -10%; left: -5%; }
.glow2 { width: 45vw; height: 45vw; background: rgba(168, 85, 247, 0.2); bottom: -10%; right: -5%; }

/* ============ MODALS ============ */
.panel-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 7000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(20px); }
.panel-modal.open { opacity: 1; pointer-events: auto; }
.panel-container { background: #0a0a12; border: 2px solid rgba(255,255,255,0.1); border-radius: 24px; width: 95%; max-width: 1000px; padding: 35px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); max-height: 85vh; overflow-y: auto; }
.panel-close { position: absolute; top: 15px; right: 25px; font-size: 35px; color: #666; cursor: pointer; transition: 0.2s; }
.panel-close:hover { color: #FFF; }

/* ============ AUTH ============ */
#authScreen { position: fixed; inset: 0; z-index: 2000; background: rgba(3,3,6,0.95); backdrop-filter: blur(25px); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
#authScreen.hidden { opacity: 0; pointer-events: none; display: none !important; }
.auth-logo { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.5rem, 9vw, 5.5rem); letter-spacing: .15em; text-shadow: 0 0 30px rgba(0,255,153,0.3); }
.auth-logo span:first-child { color: #fff; }
.auth-logo span:last-child { color: #00FF99; }
.auth-card { background: rgba(10,10,16,0.7); border: 1px solid rgba(0,255,153,0.2); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 1rem; }
.auth-field input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: .8rem 1rem; font-family: 'Rajdhani'; color: #fff; font-size: 16px; width: 100%; outline: none; }
.auth-field input:focus { border-color: #00FF99; }
.auth-btn { width: 100%; padding: .9rem; font-family: 'Orbitron'; font-weight: 900; background: linear-gradient(90deg,#00FF99,#00BFFF); color: #000; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
.auth-btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(0,255,153,0.4); }

/* ============ LOBBY ============ */
#lobbyScreen { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; z-index: 1; }
#lobbyScreen.hidden { display: none !important; }
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 25px; background: rgba(4,4,8,0.85); border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(20px); z-index: 100; flex-shrink: 0; }
.user-profile-trigger { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 5px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: 0.2s; }
.user-profile-trigger:hover { border-color: #00FF99; box-shadow: 0 0 15px rgba(0,255,153,0.2); }
.avatar-container { position: relative; width: 40px; height: 40px; }
.user-avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #00FF99; background: #222; }
.lvl-badge { position: absolute; bottom: -4px; right: -4px; background: #00BFFF; color: #000; font-family: 'Orbitron'; font-weight: 900; font-size: 9px; padding: 2px 5px; border-radius: 6px; }

.cat-filter-bar { display: flex; gap: 8px; padding: 8px 25px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.04); flex-shrink: 0; z-index: 10; align-items: center; }
.cat-btn { font-family: 'Orbitron'; font-size: 9px; letter-spacing: .12em; padding: 5px 16px; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: rgba(255,255,255,0.4); cursor: pointer; transition: all .2s; }
.cat-btn.active { background: rgba(0,255,153,0.12); border-color: #00FF99; color: #00FF99; }

.carousel-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; perspective: 1800px; overflow: hidden; z-index: 10; }
.game-card { position: absolute; width: 270px; height: 400px; background: rgba(10,10,18,0.9); border: 2px solid rgba(255,255,255,0.06); border-radius: 22px; overflow: hidden; transition: all 0.6s cubic-bezier(0.16,1,0.3,1); display: flex; flex-direction: column; cursor: pointer; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
.game-card.active { transform: translateX(0) translateZ(160px) scale(1); opacity: 1; z-index: 15; border-color: var(--theme-color); box-shadow: 0 0 30px var(--theme-color); }
.card-btn { background: var(--theme-color); color: #000; padding: 10px; font-family: 'Orbitron'; font-weight: 900; font-size: 11px; border-radius: 12px; width: 100%; border: none; cursor: pointer; }

/* ============ SOCIAL & PROFILE ============ */
.modal-profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
.big-avatar-wrapper { width: 90px; height: 90px; }
.xp-track { background: rgba(255,255,255,0.05); height: 12px; border-radius: 6px; margin-top: 10px; overflow: hidden; width: 100%; border: 1px solid rgba(255,255,255,0.1); }
.xp-fill { background: linear-gradient(90deg, #00FF99, #00BFFF); height: 100%; width: 0%; transition: width 0.5s ease; }

.id-badge { background: rgba(0,255,153,0.1); color: #00FF99; padding: 4px 12px; border-radius: 8px; font-family: 'Orbitron'; font-size: 12px; font-weight: bold; margin-top: 8px; display: inline-block; border: 1px solid rgba(0,255,153,0.3); }

.social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
.social-section { background: rgba(255,255,255,0.02); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
.social-title { font-family: 'Orbitron'; font-size: 14px; color: #00FF99; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
.user-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
.user-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
.user-item img { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #00FF99; }
.add-friend-btn { margin-left: auto; background: #00FF99; color: #000; border: none; padding: 4px 10px; border-radius: 6px; font-family: 'Orbitron'; font-size: 10px; font-weight: 900; cursor: pointer; }

.search-bar { display: flex; gap: 8px; margin-bottom: 15px; }
.search-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px; color: #fff; font-family: 'Rajdhani'; outline: none; }
.search-btn { background: #00BFFF; color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; }

/* ============ GAME IFRAME ============ */
#gameContainer { position: fixed; inset: 0; z-index: 6000; background: #000; display: none; flex-direction: column; }
.game-topbar { background: #07070d; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
.back-btn { background: #EF4444; color: #FFF; border: none; padding: 9px 18px; border-radius: 8px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; font-size: 12px; }
#gameFrame { width: 100%; flex: 1; border: none; }
</style>
</head>
<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">
  <div class="auth-logo"><span>ARCADE</span><span>PREMIUM</span></div>
  <div class="auth-card">
    <div class="auth-field"><input type="text" id="loginUser" placeholder="Introduce tu Nickname VIP..."></div>
    <div class="auth-field"><input type="password" id="loginPass" placeholder="Tu Contraseña VIP..."></div>
    <button class="auth-btn" onclick="doLogin('login')">INICIAR SESIÓN</button>
    <button class="auth-btn" style="background: #1e1e2f; color: #fff; margin-top: -5px;" onclick="doLogin('register')">REGISTRARSE</button>
  </div>
</div>

<!-- ============ LOBBY SCREEN ============ -->
<div id="lobbyScreen" class="hidden">
  <header class="top-bar">
    <div class="user-profile-trigger" onclick="openProfileModal()">
      <div class="avatar-container">
        <img src="" class="user-avatar-img" id="lobbyAvatar">
        <div class="lvl-badge" id="lobbyLevel">1</div>
      </div>
      <div>
        <div style="font-weight:700;font-size:13px;" id="lobbyName">Cargando...</div>
        <div style="font-size:9px;color:rgba(0,255,153,0.7);" id="lobbyLeagueBadge">BRONCE</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 12px; border: 1px solid rgba(0,255,153,0.15);">
      <div style="font-family:'Orbitron'; font-weight:900; color:#00FF99; font-size:16px;" id="lobbyCredits">0</div>
      <div style="font-size:10px; color:rgba(255,255,255,0.4); font-family:'Orbitron';">FICHAS</div>
    </div>

    <div class="nav-menu-center">
      <button class="menu-btn" style="background:rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:8px 15px; border-radius:8px; font-family:'Orbitron'; font-size:10px; font-weight:900; cursor:pointer;" onclick="openSocialModal()">👥 SOCIAL</button>
      <button class="menu-btn gold" style="background:linear-gradient(90deg,#FF9900,#FFCC00); color:#000; border:none; padding:8px 15px; border-radius:8px; font-family:'Orbitron'; font-size:10px; font-weight:900; cursor:pointer;" onclick="openModal('shopModal')">🛒 TIENDA</button>
      <button class="menu-btn" style="border:1px solid #EF4444; color:#EF4444; background:transparent; padding:8px 15px; border-radius:8px; font-family:'Orbitron'; font-size:10px; font-weight:900; cursor:pointer;" onclick="doLogout()">SALIR</button>
    </div>
  </header>

  <nav class="cat-filter-bar">
    <button class="cat-btn active" onclick="filterCat(this, 'all')">TODOS</button>
    <button class="cat-btn" onclick="filterCat(this, 'slots')">SLOTS</button>
    <button class="cat-btn" onclick="filterCat(this, 'mesa')">MESA</button>
    <button class="cat-btn" onclick="filterCat(this, 'arcade')">ARCADE</button>
  </nav>

  <div class="carousel-area">
    <div class="nav-arrow nav-left" onclick="moveCarousel(-1)" style="left:20px; position:absolute; z-index:100; cursor:pointer; font-size:30px;">◀</div>
    <div id="carouselTrack" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; position:relative;">
      <!-- Games injected here -->
    </div>
    <div class="nav-arrow nav-right" onclick="moveCarousel(1)" style="right:20px; position:absolute; z-index:100; cursor:pointer; font-size:30px;">▶</div>
  </div>
</div>

<!-- ============ MODAL PERFIL ============ -->
<div class="panel-modal" id="profileModal">
  <div class="panel-container">
    <span class="panel-close" onclick="closeModal('profileModal')">&times;</span>
    <div class="modal-profile-header">
      <div class="big-avatar-wrapper">
        <img src="" id="profAvatar" style="width:100%; height:100%; border-radius:50%; border:3px solid #00FF99; background:#222;">
      </div>
      <div style="flex:1">
        <h2 id="profName" style="font-family:'Orbitron'">-</h2>
        <div class="id-badge" id="profID">ID: --------</div>
        <p id="profLeague" style="color:#00BFFF; font-size:13px; font-weight:bold; margin-top:5px;">LIGA: BRONCE</p>
        <div class="xp-track"><div class="xp-fill" id="profXpBar"></div></div>
        <p id="profXpTxt" style="font-size:11px; color:#aaa; margin-top:4px;">XP: 0/100</p>
      </div>
    </div>
    
    <div class="social-grid">
      <div class="social-section">
        <div class="social-title">👥 MIS AMIGOS <span id="friendCount" style="color:rgba(255,255,255,0.4); font-size:10px;">0</span></div>
        <div class="user-list" id="friendsList"></div>
      </div>
      <div class="social-section">
        <div class="social-title">✨ RECOMENDADOS</div>
        <div class="user-list" id="recommendationsList"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL SOCIAL ============ -->
<div class="panel-modal" id="socialModal">
  <div class="panel-container">
    <span class="panel-close" onclick="closeModal('socialModal')">&times;</span>
    <h2 style="font-family:'Orbitron'; color:#00FF99; margin-bottom:20px;">👥 BUSCAR AMIGOS</h2>
    <div class="search-bar">
      <input type="text" class="search-input" id="searchFriendInput" placeholder="Escribe el Nombre o ID del jugador...">
      <button class="search-btn" onclick="searchAndAddFriend()">AGREGAR</button>
    </div>
    <div class="social-section">
      <div class="social-title">🏆 TOP JUGADORES (LIGAS)</div>
      <div class="user-list" id="leaderboardList"></div>
    </div>
  </div>
</div>

<!-- ============ MODAL TIENDA ============ -->
<div class="panel-modal" id="shopModal">
  <div class="panel-container">
    <span class="panel-close" onclick="closeModal('shopModal')">&times;</span>
    <h2 style="font-family:'Orbitron'; color:#00FF99;">🛒 TIENDA DE FICHAS</h2>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin-top:20px;">
      <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; text-align:center; border:1px solid rgba(255,255,255,0.1);">
        <h3 style="font-family:'Orbitron'; font-size:14px;">BRONCE</h3>
        <p style="color:#00FF99; margin:10px 0;">1.000 FICHAS</p>
        <button class="card-btn" style="background:#cd7f32;" onclick="buyCredits(1000)">COMPRAR</button>
      </div>
      <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; text-align:center; border:1px solid rgba(255,255,255,0.1);">
        <h3 style="font-family:'Orbitron'; font-size:14px;">PLATA</h3>
        <p style="color:#00FF99; margin:10px 0;">5.000 FICHAS</p>
        <button class="card-btn" style="background:#c0c0c0;" onclick="buyCredits(5000)">COMPRAR</button>
      </div>
      <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; text-align:center; border:1px solid rgba(255,255,255,0.1);">
        <h3 style="font-family:'Orbitron'; font-size:14px;">ORO</h3>
        <p style="color:#00FF99; margin:10px 0;">10.000 FICHAS</p>
        <button class="card-btn" style="background:#ffd700;" onclick="buyCredits(10000)">COMPRAR</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ GAME CONTAINER ============ -->
<div id="gameContainer">
  <div class="game-topbar">
    <div style="font-family:'Orbitron'; font-weight:900; letter-spacing:1px;" id="gameActiveTitle">JUEGO EN CURSO</div>
    <button class="back-btn" onclick="closeGame()">VOLVER AL LOBBY</button>
  </div>
  <iframe id="gameFrame" src=""></iframe>
</div>

<script>
const API_URL = "/api";
let currentUser = localStorage.getItem("arcade_user") || null;
let carouselIndex = 0;
let hudInterval = null;

const GAMES = [
  { id: 'slots', title: 'LUCKY SEVENS', file: 'slots.html', cat: 'slots', color: '#00FF99', icon: '🎰' },
  { id: 'keno', title: 'KENO TURBO', file: 'keno.html', cat: 'arcade', color: '#00BFFF', icon: '🎱' },
  { id: 'mines', title: 'MINES ARCADE', file: 'mines.html', cat: 'arcade', color: '#A855F7', icon: '💣' },
  { id: 'blackjack', title: 'BLACKJACK VIP', file: 'blackjack.html', cat: 'mesa', color: '#FACC15', icon: '🃏' },
  { id: 'crash', title: 'ROCKET CRASH', file: 'crash.html', cat: 'arcade', color: '#22C55E', icon: '🚀' }
];

async function doLogin(action) {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value.trim();
  if (!username || !password) { alert("❌ Introduce datos."); return; }
  try {
    const res = await fetch(`${API_URL}/auth/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      if (action === 'login') {
        localStorage.setItem("arcade_user", username);
        currentUser = username;
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("lobbyScreen").classList.remove("hidden");
        initLobby();
      } else alert("✅ Registrado. Inicia sesión.");
    } else alert(`❌ Error: ${data.detail}`);
  } catch(e) { alert("❌ Error de conexión."); }
}

async function updateHUD() {
  if(!currentUser) return;
  try {
    const res = await fetch(`${API_URL}/progression/profile/${currentUser}`);
    if(res.ok) {
      const p = await res.json();
      document.getElementById("lobbyName").innerText = p.username.toUpperCase();
      document.getElementById("lobbyLevel").innerText = p.level;
      document.getElementById("lobbyAvatar").src = `https://api.dicebear.com/7.x/bottts/svg?seed=${p.username}`;
      document.getElementById("lobbyLeagueBadge").innerText = p.league.toUpperCase();
      
      const resW = await fetch(`${API_URL}/wallet/balance/${currentUser}`);
      if(resW.ok) {
        const w = await resW.json();
        document.getElementById("lobbyCredits").innerText = Math.floor(w.balance).toLocaleString();
      }
    }
  } catch(e) { console.log("HUD Error"); }
}

function initLobby() {
  renderGames();
  updateHUD();
  if(!hudInterval) hudInterval = setInterval(updateHUD, 10000);
  moveCarousel(0);
}

function renderGames() {
  const track = document.getElementById("carouselTrack");
  track.innerHTML = GAMES.map(g => `
    <div class="game-card" data-cat="${g.cat}" style="--theme-color:${g.color}">
      <div style="height:175px; display:flex; align-items:center; justify-content:center; font-size:80px;">${g.icon}</div>
      <div style="padding:20px; text-align:center;">
        <div style="font-family:'Orbitron'; font-weight:900; font-size:18px;">${g.title}</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.5); margin:5px 0 15px;">${g.cat.toUpperCase()}</div>
        <button class="card-btn" onclick="launchGame('${g.file}')">JUGAR</button>
      </div>
    </div>
  `).join('');
}

async function openProfileModal() {
  const res = await fetch(`${API_URL}/progression/profile/${currentUser}`);
  if(res.ok) {
    const p = await res.json();
    document.getElementById("profName").innerText = p.username.toUpperCase();
    document.getElementById("profID").innerText = `ID: ${p.unique_id}`;
    document.getElementById("profAvatar").src = `https://api.dicebear.com/7.x/bottts/svg?seed=${p.username}`;
    document.getElementById("profLeague").innerText = `LIGA: ${p.league.toUpperCase()}`;
    document.getElementById("profXpBar").style.width = `${(p.xp / p.xp_needed) * 100}%`;
    document.getElementById("profXpTxt").innerText = `XP: ${p.xp}/${p.xp_needed}`;
    
    loadFriends();
    loadRecommendations();
    openModal("profileModal");
  }
}

async function loadFriends() {
  const res = await fetch(`${API_URL}/progression/friends/${currentUser}`);
  if(res.ok) {
    const data = await res.json();
    document.getElementById("friendCount").innerText = data.friends.length;
    document.getElementById("friendsList").innerHTML = data.friends.map(f => `
      <div class="user-item">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${f.username}">
        <div>
          <div style="font-weight:bold; font-size:13px;">${f.username.toUpperCase()}</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.4);">ID: ${f.unique_id}</div>
        </div>
      </div>
    `).join('') || '<p style="font-size:12px; color:rgba(255,255,255,0.3); text-align:center;">No tienes amigos aún.</p>';
  }
}

async function loadRecommendations() {
  const res = await fetch(`${API_URL}/progression/friends/${currentUser}/recommendations`);
  if(res.ok) {
    const data = await res.json();
    document.getElementById("recommendationsList").innerHTML = data.recommendations.map(r => `
      <div class="user-item">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${r.username}">
        <div>
          <div style="font-weight:bold; font-size:13px;">${r.username.toUpperCase()}</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.4);">ID: ${r.unique_id}</div>
        </div>
        <button class="add-friend-btn" onclick="addFriend('${r.username}')">AÑADIR</button>
      </div>
    `).join('');
  }
}

async function addFriend(friend) {
  const res = await fetch(`${API_URL}/progression/friends/${currentUser}/add`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ friend_username: friend })
  });
  if(res.ok) { alert("¡Solicitud enviada!"); loadRecommendations(); }
}

async function searchAndAddFriend() {
  const input = document.getElementById("searchFriendInput");
  if(!input.value.trim()) return;
  await addFriend(input.value.trim());
  input.value = "";
}

async function openSocialModal() {
  const res = await fetch(`${API_URL}/progression/leagues/leaderboard`);
  if(res.ok) {
    const data = await res.json();
    document.getElementById("leaderboardList").innerHTML = data.leaderboard.map((u, i) => `
      <div class="user-item">
        <div style="font-family:'Orbitron'; font-weight:900; color:#00FF99; width:25px;">${i+1}</div>
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${u.username}">
        <div style="flex:1;">
          <div style="font-weight:bold; font-size:13px;">${u.username.toUpperCase()}</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.4);">${u.rank.toUpperCase()}</div>
        </div>
        <div style="font-family:'Orbitron'; font-size:11px; color:#00BFFF;">${u.points} PTS</div>
      </div>
    `).join('');
    openModal("socialModal");
  }
}

function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

function launchGame(file) {
  document.getElementById("gameActiveTitle").innerText = file.replace(".html","").toUpperCase();
  document.getElementById("gameFrame").src = `/${file}?u=${encodeURIComponent(currentUser)}`;
  document.getElementById("gameContainer").style.display = "flex";
}

function closeGame() {
  document.getElementById("gameContainer").style.display = "none";
  document.getElementById("gameFrame").src = "";
  updateHUD();
}

function moveCarousel(dir) {
  const cards = Array.from(document.querySelectorAll('.game-card:not(.cat-hidden)'));
  if(!cards.length) return;
  carouselIndex = (carouselIndex + dir + cards.length) % cards.length;
  cards.forEach((c, i) => {
    c.className = "game-card";
    if(i === carouselIndex) c.classList.add("active");
    else if(i === (carouselIndex+1)%cards.length) c.classList.add("next");
    else if(i === (carouselIndex-1+cards.length)%cards.length) c.classList.add("prev");
    else c.classList.add("hidden-card");
  });
}

function filterCat(btn, cat) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.game-card').forEach(c => c.classList.toggle('cat-hidden', cat !== 'all' && c.dataset.cat !== cat));
  carouselIndex = 0; moveCarousel(0);
}

async function buyCredits(amount) {
  const res = await fetch(`${API_URL}/wallet/deposit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: currentUser, amount })
  });
  if(res.ok) { updateHUD(); closeModal('shopModal'); }
}

function doLogout() { localStorage.clear(); window.location.reload(); }

window.onload = () => { if(currentUser) { document.getElementById("authScreen").classList.add("hidden"); document.getElementById("lobbyScreen").classList.remove("hidden"); initLobby(); } };
</script>
