<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE PREMIUM — Cyber Casino Cloud 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Rajdhani', sans-serif;
  background: linear-gradient(-45deg, #050508, #120626, #091526, #020204);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: #FFF;
  overflow: hidden;
  user-select: none;
  cursor: url('/assets/coin-cursor.png') 24 24, auto;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.bg-glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(140px);
  z-index: 0;
  opacity: 0.4;
  pointer-events: none;
  animation: glow-pulse 8s ease-in-out infinite;
}

@keyframes glow-pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.6; }
}

.glow1 {
  width: 50vw;
  height: 50vw;
  background: rgba(0, 255, 153, 0.3);
  top: -20%;
  left: -10%;
}

.glow2 {
  width: 55vw;
  height: 55vw;
  background: rgba(168, 85, 247, 0.3);
  bottom: -15%;
  right: -10%;
}

.glow3 {
  width: 45vw;
  height: 45vw;
  background: rgba(0, 191, 255, 0.2);
  top: 50%;
  right: -5%;
  animation: glow-pulse 6s ease-in-out infinite reverse;
}

/* ============ AUTH SCREEN ============ */
#authScreen {
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(3, 3, 6, 0.98);
  backdrop-filter: blur(30px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: 0.5s;
}

#authScreen.hidden {
  opacity: 0;
  pointer-events: none;
  display: none !important;
}

.auth-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(3.5rem, 9vw, 6rem);
  letter-spacing: 0.2em;
  text-shadow: 0 0 30px rgba(0, 255, 153, 0.5), 0 0 60px rgba(0, 191, 255, 0.3);
  margin-bottom: 1rem;
  animation: logo-glow 3s ease-in-out infinite;
}

@keyframes logo-glow {
  0%, 100% { text-shadow: 0 0 30px rgba(0, 255, 153, 0.5), 0 0 60px rgba(0, 191, 255, 0.3); }
  50% { text-shadow: 0 0 50px rgba(0, 255, 153, 0.8), 0 0 100px rgba(0, 191, 255, 0.6); }
}

.auth-logo span:first-child { color: #fff; }
.auth-logo span:last-child { color: #00FF99; }

.auth-subtitle {
  font-family: 'Orbitron';
  font-size: 11px;
  letter-spacing: 4px;
  color: rgba(0, 255, 153, 0.6);
  margin-bottom: 2.5rem;
  animation: pulse-text 2s ease-in-out infinite;
}

@keyframes pulse-text {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.auth-card {
  background: rgba(10, 10, 16, 0.8);
  border: 2px solid rgba(0, 255, 153, 0.3);
  border-radius: 20px;
  padding: 3rem;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  box-shadow: 0 0 50px rgba(0, 255, 153, 0.2), inset 0 0 30px rgba(0, 255, 153, 0.05);
  animation: card-float 3s ease-in-out infinite;
}

@keyframes card-float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.auth-field {
  position: relative;
}

.auth-field input {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(0, 255, 153, 0.2);
  border-radius: 12px;
  padding: 1rem 1.2rem;
  font-family: 'Rajdhani';
  color: #fff;
  font-size: 16px;
  width: 100%;
  outline: none;
  transition: all 0.3s;
}

.auth-field input:focus {
  border-color: #00FF99;
  box-shadow: 0 0 20px rgba(0, 255, 153, 0.3), inset 0 0 10px rgba(0, 255, 153, 0.1);
  background: rgba(0, 255, 153, 0.05);
}

.auth-btn {
  width: 100%;
  padding: 1rem;
  font-family: 'Orbitron';
  font-weight: 900;
  background: linear-gradient(135deg, #00FF99, #00BFFF);
  color: #000;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s;
  font-size: 14px;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}

.auth-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.auth-btn:hover::before {
  left: 100%;
}

.auth-btn:hover {
  filter: brightness(1.2);
  box-shadow: 0 0 30px rgba(0, 255, 153, 0.5), 0 0 60px rgba(0, 191, 255, 0.3);
  transform: translateY(-2px);
}

.auth-btn:active {
  transform: translateY(0px);
}

.auth-btn.register {
  background: linear-gradient(135deg, #A855F7, #EC4899);
}

/* ============ LOBBY SCREEN ============ */
#lobbyScreen {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  z-index: 1;
}

#lobbyScreen.hidden { display: none !important; }

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 30px;
  background: rgba(4, 4, 8, 0.9);
  border-bottom: 2px solid rgba(0, 255, 153, 0.1);
  backdrop-filter: blur(20px);
  z-index: 100;
  flex-shrink: 0;
  box-shadow: 0 0 30px rgba(0, 255, 153, 0.1);
}

.user-profile-trigger {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 255, 153, 0.05);
  padding: 8px 16px;
  border-radius: 16px;
  border: 1px solid rgba(0, 255, 153, 0.2);
  cursor: pointer;
  transition: all 0.3s;
}

.user-profile-trigger:hover {
  border-color: #00FF99;
  background: rgba(0, 255, 153, 0.1);
  box-shadow: 0 0 20px rgba(0, 255, 153, 0.3);
  transform: translateY(-2px);
}

.avatar-container {
  position: relative;
  width: 45px;
  height: 45px;
}

.user-avatar-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #00FF99;
  background: #222;
  animation: avatar-pulse 2s ease-in-out infinite;
}

@keyframes avatar-pulse {
  0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 153, 0.3); }
  50% { box-shadow: 0 0 20px rgba(0, 255, 153, 0.6); }
}

.lvl-badge {
  position: absolute;
  bottom: -5px;
  right: -5px;
  background: linear-gradient(135deg, #00BFFF, #A855F7);
  color: #fff;
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: 10px;
  padding: 3px 6px;
  border-radius: 8px;
  border: 2px solid #000;
  box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
}

.credits-display {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 255, 153, 0.08);
  padding: 8px 18px;
  border-radius: 14px;
  border: 2px solid rgba(0, 255, 153, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 153, 0.1);
}

.credits-value {
  font-family: 'Orbitron';
  font-weight: 900;
  color: #00FF99;
  font-size: 18px;
  text-shadow: 0 0 10px rgba(0, 255, 153, 0.5);
}

.nav-menu-center {
  display: flex;
  gap: 12px;
}

.menu-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 10px 18px;
  border-radius: 10px;
  font-family: 'Orbitron';
  font-weight: 700;
  font-size: 11px;
  color: #ccc;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}

.menu-btn:hover {
  border-color: #00BFFF;
  color: #00BFFF;
  box-shadow: 0 0 15px rgba(0, 191, 255, 0.3);
  transform: translateY(-2px);
}

.menu-btn.gold {
  background: linear-gradient(135deg, #FF9900, #FFCC00);
  border: none;
  color: #000;
  font-weight: 900;
}

.menu-btn.gold:hover {
  box-shadow: 0 0 20px rgba(255, 153, 0, 0.5);
}

/* ============ CAROUSEL 3D ============ */
.carousel-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  perspective: 2000px;
  overflow: hidden;
  z-index: 10;
}

.carousel-track {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
}

.game-card {
  position: absolute;
  width: 300px;
  height: 420px;
  background: rgba(10, 10, 18, 0.95);
  border: 2px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  overflow: hidden;
  transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  cursor: pointer;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
  transform-style: preserve-3d;
}

.game-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, rgba(0, 255, 153, 0.1), transparent);
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 1;
}

.game-card:hover::before {
  opacity: 1;
}

.game-card.active {
  transform: translateX(0) translateZ(200px) scale(1.05);
  opacity: 1;
  z-index: 15;
  border-color: var(--theme-color);
  box-shadow: 0 0 40px var(--theme-color), 0 20px 60px rgba(0, 0, 0, 0.8);
}

.game-card.next {
  transform: translateX(120%) translateZ(-150px) rotateY(-35deg) scale(0.8);
  opacity: 0.5;
  z-index: 10;
}

.game-card.prev {
  transform: translateX(-120%) translateZ(-150px) rotateY(35deg) scale(0.8);
  opacity: 0.5;
  z-index: 10;
}

.game-card.hidden-card {
  transform: translateX(0) translateZ(-600px) scale(0.3);
  opacity: 0;
  z-index: 1;
  pointer-events: none;
}

.card-art {
  height: 200px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background-size: cover;
  background-position: center;
  font-size: 100px;
}

.card-art::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent, rgba(10, 10, 18, 0.8));
}

.card-icon {
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
  animation: icon-bounce 2s ease-in-out infinite;
}

@keyframes icon-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.card-info {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: center;
}

.card-title {
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: 18px;
  color: #FFF;
}

.card-btn {
  background: var(--theme-color);
  color: #000;
  padding: 12px;
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 0 15px var(--theme-color);
}

.card-btn:hover {
  filter: brightness(1.2);
  transform: translateY(-2px);
  box-shadow: 0 0 25px var(--theme-color);
}

.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 200;
  background: rgba(0, 0, 0, 0.6);
  border: 2px solid rgba(0, 255, 153, 0.3);
  color: #FFF;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
}

.nav-arrow:hover {
  border-color: #00FF99;
  color: #00FF99;
  box-shadow: 0 0 30px rgba(0, 255, 153, 0.5);
  background: rgba(0, 255, 153, 0.1);
  transform: translateY(-50%) scale(1.1);
}

.nav-left { left: 30px; }
.nav-right { right: 30px; }

/* ============ MODALS ============ */
.panel-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  z-index: 7000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  backdrop-filter: blur(25px);
}

.panel-modal.open {
  opacity: 1;
  pointer-events: auto;
}

.panel-container {
  background: rgba(10, 10, 18, 0.95);
  border: 2px solid rgba(0, 255, 153, 0.2);
  border-radius: 24px;
  width: 95%;
  max-width: 1000px;
  padding: 35px;
  position: relative;
  box-shadow: 0 0 60px rgba(0, 255, 153, 0.1), inset 0 0 30px rgba(0, 255, 153, 0.05);
  max-height: 85vh;
  overflow-y: auto;
  animation: modal-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modal-pop {
  from {
    transform: scale(0.9);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.panel-close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 35px;
  color: #666;
  cursor: pointer;
  transition: all 0.2s;
}

.panel-close:hover {
  color: #00FF99;
  transform: rotate(90deg);
}

/* ============ GAME IFRAME ============ */
#gameContainer {
  position: fixed;
  inset: 0;
  z-index: 6000;
  background: #000;
  display: none;
  flex-direction: column;
}

.game-topbar {
  background: #07070d;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid rgba(0, 255, 153, 0.1);
}

.back-btn {
  background: linear-gradient(135deg, #EF4444, #DC2626);
  color: #FFF;
  border: none;
  padding: 10px 20px;
  border-radius: 10px;
  font-family: 'Orbitron';
  font-weight: 900;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.3s;
}

.back-btn:hover {
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
  transform: translateY(-2px);
}

#gameFrame {
  width: 100%;
  flex: 1;
  border: none;
}

/* Responsive */
@media (max-width: 768px) {
  .top-bar { padding: 10px 15px; }
  .game-card { width: 240px; height: 340px; }
  .nav-arrow { width: 45px; height: 45px; font-size: 18px; }
}
</style>
</head>
<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>
<div class="bg-glow glow3"></div>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">
  <div class="auth-logo"><span>ARCADE</span><span>PREMIUM</span></div>
  <div class="auth-subtitle">⚡ CYBER CASINO CLOUD 3D ⚡</div>
  <div class="auth-card">
    <div class="auth-field">
      <input type="text" id="loginUser" placeholder="🎮 Nickname VIP..." autocomplete="username">
    </div>
    <div class="auth-field">
      <input type="password" id="loginPass" placeholder="🔐 Contraseña..." autocomplete="current-password">
    </div>
    <button class="auth-btn" onclick="doLogin('login')">⚡ INICIAR SESIÓN ⚡</button>
    <button class="auth-btn register" onclick="doLogin('register')">✨ REGISTRARSE ✨</button>
  </div>
</div>

<!-- ============ LOBBY SCREEN ============ -->
<div id="lobbyScreen" class="hidden">
  <header class="top-bar">
    <div class="user-profile-trigger" onclick="openProfileModal()">
      <div class="avatar-container">
        <img src="" class="user-avatar-img" id="lobbyAvatar">
        <div class="lvl-badge" id="lobbyLevel">1</div>
      </div>
      <div>
        <div style="font-weight:700;font-size:14px;" id="lobbyName">Cargando...</div>
        <div style="font-size:10px;color:rgba(0,255,153,0.7);" id="lobbyLeagueBadge">BRONCE</div>
      </div>
    </div>

    <div class="credits-display">
      <div class="credits-value" id="lobbyCredits">0</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.5); font-family:'Orbitron';">FICHAS</div>
    </div>

    <div class="nav-menu-center">
      <button class="menu-btn" onclick="openSocialModal()">👥 SOCIAL</button>
      <button class="menu-btn gold" onclick="battlePass.openBattlePassModal(currentUser)">🎫 PASE</button>
      <button class="menu-btn gold" onclick="openModal('shopModal')">🛒 TIENDA</button>
      <button class="menu-btn" style="border-color:#EF4444;color:#EF4444" onclick="doLogout()">SALIR</button>
    </div>
  </header>

  <div class="carousel-area">
    <div class="nav-arrow nav-left" onclick="moveCarousel(-1)">◀</div>
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="nav-arrow nav-right" onclick="moveCarousel(1)">▶</div>
  </div>
</div>

<!-- ============ MODAL PERFIL ============ -->
<div class="panel-modal" id="profileModal">
  <div class="panel-container">
    <span class="panel-close" onclick="closeModal('profileModal')">&times;</span>
    <div style="display:flex; gap:20px; margin-bottom:25px;">
      <img src="" id="profAvatar" style="width:100px; height:100px; border-radius:50%; border:3px solid #00FF99; background:#222;">
      <div style="flex:1;">
        <h2 id="profName" style="font-family:'Orbitron'; color:#00FF99;">-</h2>
        <div style="background:rgba(0,255,153,0.1); color:#00FF99; padding:4px 12px; border-radius:8px; font-family:'Orbitron'; font-size:12px; font-weight:bold; margin-top:8px; display:inline-block; border:1px solid rgba(0,255,153,0.3);" id="profID">ID: --------</div>
        <p id="profLeague" style="color:#00BFFF; font-size:13px; font-weight:bold; margin-top:8px;">LIGA: BRONCE</p>
      </div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
      <div style="background:rgba(255,255,255,0.02); border-radius:16px; padding:20px; border:1px solid rgba(255,255,255,0.05);">
        <div style="font-family:'Orbitron'; font-size:14px; color:#00FF99; margin-bottom:15px;">👥 MIS AMIGOS</div>
        <div id="friendsList" style="display:flex; flex-direction:column; gap:10px; max-height:300px; overflow-y:auto;"></div>
      </div>
      <div style="background:rgba(255,255,255,0.02); border-radius:16px; padding:20px; border:1px solid rgba(255,255,255,0.05);">
        <div style="font-family:'Orbitron'; font-size:14px; color:#00FF99; margin-bottom:15px;">✨ RECOMENDADOS</div>
        <div id="recommendationsList" style="display:flex; flex-direction:column; gap:10px; max-height:300px; overflow-y:auto;"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL SOCIAL ============ -->
<div class="panel-modal" id="socialModal">
  <div class="panel-container">
    <span class="panel-close" onclick="closeModal('socialModal')">&times;</span>
    <h2 style="font-family:'Orbitron'; color:#00FF99; margin-bottom:20px;">👥 BUSCAR AMIGOS</h2>
    <div style="display:flex; gap:8px; margin-bottom:20px;">
      <input type="text" id="searchFriendInput" placeholder="Nombre o ID..." style="flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:8px 12px; color:#fff; font-family:'Rajdhani'; outline:none;">
      <button onclick="searchAndAddFriend()" style="background:#00BFFF; color:#000; border:none; padding:8px 15px; border-radius:8px; font-family:'Orbitron'; font-weight:900; cursor:pointer;">AGREGAR</button>
    </div>
    <div id="leaderboardList" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>
</div>

<!-- ============ MODAL TIENDA ============ -->
<div class="panel-modal" id="shopModal">
  <div class="panel-container">
    <span class="panel-close" onclick="closeModal('shopModal')">&times;</span>
    <h2 style="font-family:'Orbitron'; color:#00FF99;">🛒 TIENDA DE FICHAS</h2>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:20px;">
      <div style="background:rgba(205,127,50,0.1); padding:25px; border-radius:15px; text-align:center; border:2px solid rgba(205,127,50,0.3);">
        <h3 style="font-family:'Orbitron'; font-size:16px; color:#cd7f32;">BRONCE</h3>
        <p style="color:#00FF99; margin:15px 0; font-family:'Orbitron'; font-weight:900;">1.000 FICHAS</p>
        <button onclick="buyCredits(1000)" style="width:100%; background:#cd7f32; color:#fff; border:none; padding:12px; border-radius:10px; font-family:'Orbitron'; font-weight:900; cursor:pointer;">COMPRAR</button>
      </div>
      <div style="background:rgba(192,192,192,0.1); padding:25px; border-radius:15px; text-align:center; border:2px solid rgba(192,192,192,0.3);">
        <h3 style="font-family:'Orbitron'; font-size:16px; color:#c0c0c0;">PLATA</h3>
        <p style="color:#00FF99; margin:15px 0; font-family:'Orbitron'; font-weight:900;">5.000 FICHAS</p>
        <button onclick="buyCredits(5000)" style="width:100%; background:#c0c0c0; color:#000; border:none; padding:12px; border-radius:10px; font-family:'Orbitron'; font-weight:900; cursor:pointer;">COMPRAR</button>
      </div>
      <div style="background:rgba(255,215,0,0.1); padding:25px; border-radius:15px; text-align:center; border:2px solid rgba(255,215,0,0.3);">
        <h3 style="font-family:'Orbitron'; font-size:16px; color:#ffd700;">ORO</h3>
        <p style="color:#00FF99; margin:15px 0; font-family:'Orbitron'; font-weight:900;">10.000 FICHAS</p>
        <button onclick="buyCredits(10000)" style="width:100%; background:#ffd700; color:#000; border:none; padding:12px; border-radius:10px; font-family:'Orbitron'; font-weight:900; cursor:pointer;">COMPRAR</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ GAME CONTAINER ============ -->
<div id="gameContainer">
  <div class="game-topbar">
    <div style="font-family:'Orbitron'; font-weight:900; letter-spacing:1px; font-size:16px;" id="gameActiveTitle">JUEGO EN CURSO</div>
    <button class="back-btn" onclick="closeGame()">← VOLVER AL LOBBY</button>
  </div>
  <iframe id="gameFrame" src=""></iframe>
</div>

<script src="/animations.js"></script>
<script src="/battlepass-system.js"></script>
<script>
const API_URL = "/api";
let currentUser = localStorage.getItem("arcade_user") || null;
let carouselIndex = 0;
let hudInterval = null;
const winAnim = new WinAnimation();

const GAMES = [
  { id: 'slots', title: 'LUCKY SEVENS', file: 'slots.html', cat: 'slots', color: '#00FF99', img: '/assets/games/0fHpJdYkysVc.jpg' },
  { id: 'keno', title: 'KENO TURBO', file: 'keno.html', cat: 'arcade', color: '#00BFFF', img: '/assets/games/6IpXKW058UDZ.jpg' },
  { id: 'mines', title: 'MINES ARCADE', file: 'mines.html', cat: 'arcade', color: '#A855F7', img: '/assets/games/wY7BOFGHFma4.jpg' },
  { id: 'blackjack', title: 'BLACKJACK VIP', file: 'blackjack.html', cat: 'mesa', color: '#FACC15', img: '/assets/games/ctMqgVaaG9Cs.jpg' },
  { id: 'crash', title: 'ROCKET CRASH', file: 'crash.html', cat: 'arcade', color: '#22C55E', img: '/assets/games/upFumWw48aLz.jpg' },
  { id: '3_en_1', title: '3 EN 1 ARCADE', file: '3_en_1.html', cat: 'arcade', color: '#A855F7', img: '/assets/games/DZAqgKJyKLIe.jpg' },
  { id: 'plinko', title: 'PLINKO EXTREME', file: 'plinko.html', cat: 'arcade', color: '#FF9F43', img: '/assets/games/LzigdfqGJqBH.jpg' },
  { id: 'roulette', title: 'ROULETTE ELITE', file: 'roulette.html', cat: 'mesa', color: '#FF1744', img: '/assets/games/ueFafQNyPKsD.jpg' }
];

async function doLogin(action) {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value.trim();
  if (!username || !password) { alert("❌ Introduce datos."); return; }
  try {
    const res = await fetch(`${API_URL}/auth/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      if (action === 'login') {
        localStorage.setItem("arcade_user", username);
        currentUser = username;
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("lobbyScreen").classList.remove("hidden");
        initLobby();
      } else alert("✅ Registrado. Inicia sesión.");
    } else alert(`❌ Error: ${data.detail}`);
  } catch(e) { alert("❌ Error de conexión."); }
}

async function updateHUD() {
  if(!currentUser) return;
  try {
    const res = await fetch(`${API_URL}/progression/profile/${currentUser}`);
    if(res.ok) {
      const p = await res.json();
      document.getElementById("lobbyName").innerText = p.username.toUpperCase();
      document.getElementById("lobbyLevel").innerText = p.level;
      document.getElementById("lobbyAvatar").src = `https://api.dicebear.com/7.x/bottts/svg?seed=${p.username}`;
      document.getElementById("lobbyLeagueBadge").innerText = p.league.toUpperCase();
      
      const resW = await fetch(`${API_URL}/wallet/balance/${currentUser}`);
      if(resW.ok) {
        const w = await resW.json();
        document.getElementById("lobbyCredits").innerText = Math.floor(w.balance).toLocaleString();
      }
    }
  } catch(e) { console.log("HUD Error"); }
}

function renderGames() {
  const track = document.getElementById("carouselTrack");
  track.innerHTML = GAMES.map(g => `
    <div class="game-card" data-cat="${g.cat}" style="--theme-color:${g.color}">
      <div class="card-art"><img src="${g.img}" alt="${g.title}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;"></div>
      <div class="card-info">
        <div><div style="font-family:'Orbitron'; font-weight:900; font-size:18px;">${g.title}</div></div>
        <button class="card-btn" onclick="launchGame('${g.file}')">JUGAR</button>
      </div>
    </div>
  `).join('');
}

function initLobby() {
  renderGames();
  updateHUD();
  if(!hudInterval) hudInterval = setInterval(updateHUD, 10000);
  moveCarousel(0);
}

async function openProfileModal() {
  const res = await fetch(`${API_URL}/progression/profile/${currentUser}`);
  if(res.ok) {
    const p = await res.json();
    document.getElementById("profName").innerText = p.username.toUpperCase();
    document.getElementById("profID").innerText = `ID: ${p.unique_id}`;
    document.getElementById("profAvatar").src = `https://api.dicebear.com/7.x/bottts/svg?seed=${p.username}`;
    document.getElementById("profLeague").innerText = `LIGA: ${p.league.toUpperCase()}`;
    
    loadFriends();
    loadRecommendations();
    openModal("profileModal");
  }
}

async function loadFriends() {
  const res = await fetch(`${API_URL}/progression/friends/${currentUser}`);
  if(res.ok) {
    const data = await res.json();
    document.getElementById("friendsList").innerHTML = data.friends.map(f => `
      <div style="display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.03); padding:10px; border-radius:10px;">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${f.username}" style="width:35px; height:35px; border-radius:50%; border:1px solid #00FF99;">
        <div style="flex:1;">
          <div style="font-weight:bold; font-size:12px;">${f.username.toUpperCase()}</div>
          <div style="font-size:9px; color:rgba(255,255,255,0.4);">ID: ${f.unique_id}</div>
        </div>
      </div>
    `).join('') || '<p style="font-size:11px; color:rgba(255,255,255,0.3); text-align:center;">Sin amigos aún.</p>';
  }
}

async function loadRecommendations() {
  const res = await fetch(`${API_URL}/progression/friends/${currentUser}/recommendations`);
  if(res.ok) {
    const data = await res.json();
    document.getElementById("recommendationsList").innerHTML = data.recommendations.map(r => `
      <div style="display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.03); padding:10px; border-radius:10px;">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${r.username}" style="width:35px; height:35px; border-radius:50%; border:1px solid #00FF99;">
        <div style="flex:1;">
          <div style="font-weight:bold; font-size:12px;">${r.username.toUpperCase()}</div>
          <div style="font-size:9px; color:rgba(255,255,255,0.4);">ID: ${r.unique_id}</div>
        </div>
        <button onclick="addFriend('${r.username}')" style="background:#00FF99; color:#000; border:none; padding:4px 10px; border-radius:6px; font-family:'Orbitron'; font-size:9px; font-weight:900; cursor:pointer;">+</button>
      </div>
    `).join('');
  }
}

async function addFriend(friend) {
  const res = await fetch(`${API_URL}/progression/friends/${currentUser}/add`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ friend_username: friend })
  });
  if(res.ok) { alert("¡Solicitud enviada!"); loadRecommendations(); }
}

async function searchAndAddFriend() {
  const input = document.getElementById("searchFriendInput");
  if(!input.value.trim()) return;
  await addFriend(input.value.trim());
  input.value = "";
}

async function openSocialModal() {
  const res = await fetch(`${API_URL}/progression/leagues/leaderboard`);
  if(res.ok) {
    const data = await res.json();
    document.getElementById("leaderboardList").innerHTML = data.leaderboard.map((u, i) => `
      <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.03); padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.05);">
        <div style="font-family:'Orbitron'; font-weight:900; color:#00FF99; width:30px; text-align:center;">${i+1}</div>
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${u.username}" style="width:40px; height:40px; border-radius:50%; border:2px solid #00FF99;">
        <div style="flex:1;">
          <div style="font-weight:bold; font-size:13px;">${u.username.toUpperCase()}</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.4);">${u.rank.toUpperCase()}</div>
        </div>
        <div style="font-family:'Orbitron'; font-size:12px; color:#00BFFF; font-weight:bold;">${u.points} PTS</div>
      </div>
    `).join('');
    openModal("socialModal");
  }
}

function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

function launchGame(file) {
  if (!currentUser) { alert("Inicia sesión primero"); return; }
  document.getElementById("gameActiveTitle").innerText = file.replace(".html","").replace("_", " ").toUpperCase();
  const gameFrame = document.getElementById("gameFrame");
  gameFrame.src = `/${file}?u=${encodeURIComponent(currentUser)}`;
  document.getElementById("gameContainer").style.display = "flex";
  
  // Enviar créditos al iframe cuando cargue
  setTimeout(() => {
    const balance = parseInt(localStorage.getItem('arcade_credits')) || 0;
    gameFrame.contentWindow.postMessage({ type: 'credits_updated', balance }, '*');
  }, 500);
}

function closeGame() {
  document.getElementById("gameContainer").style.display = "none";
  document.getElementById("gameFrame").src = "";
  updateHUD();
}

function moveCarousel(dir) {
  const cards = Array.from(document.querySelectorAll('.game-card'));
  if(!cards.length) return;
  carouselIndex = (carouselIndex + dir + cards.length) % cards.length;
  cards.forEach((c, i) => {
    c.className = "game-card";
    if(i === carouselIndex) c.classList.add("active");
    else if(i === (carouselIndex+1)%cards.length) c.classList.add("next");
    else if(i === (carouselIndex-1+cards.length)%cards.length) c.classList.add("prev");
    else c.classList.add("hidden-card");
  });
}

async function buyCredits(amount) {
  try {
    const res = await fetch(`${API_URL}/wallet/deposit`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: currentUser, amount })
    });
    if(res.ok) { 
      const data = await res.json();
      const newBalance = Math.floor(data.new_balance || 0);
      localStorage.setItem('arcade_credits', newBalance);
      document.getElementById('lobbyCredits').innerText = newBalance.toLocaleString();
      
      const gameFrame = document.getElementById('gameFrame');
      if(gameFrame && gameFrame.contentWindow) {
        gameFrame.contentWindow.postMessage({ type: 'credits_updated', balance: newBalance }, '*');
      }
      
      closeModal('shopModal');
      winAnim.fountainEffect(amount);
    } else {
      const err = await res.json();
      alert("Error al comprar: " + (err.detail || "Error desconocido"));
    }
  } catch(e) {
    alert("Error de conexión al comprar créditos.");
  }
}

function doLogout() { localStorage.clear(); window.location.reload(); }

window.onload = () => { if(currentUser) { document.getElementById("authScreen").classList.add("hidden"); document.getElementById("lobbyScreen").classList.remove("hidden"); initLobby(); } };
</script>
</body>
</html>
