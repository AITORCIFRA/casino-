<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE PREMIUM - Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link href="/css/lobby.css" rel="stylesheet">
<style>
.card-art { width: 100%; height: 120px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.card-art img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<div id="authScreen" class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">🎰 ARCADE PREMIUM</div>
    <div class="auth-title">CASINO EXTREMO</div>
    
    <div class="auth-form">
      <input type="text" id="loginUser" placeholder="Usuario" class="auth-input">
      <input type="password" id="loginPass" placeholder="Contraseña" class="auth-input">
      
      <div class="auth-buttons">
        <button class="auth-btn register" onclick="doLogin('register')">REGISTRARSE</button>
        <button class="auth-btn login" onclick="doLogin('login')">INICIAR SESIÓN</button>
      </div>
    </div>
  </div>
</div>

<div id="lobbyScreen" class="hidden">
  <header class="nav-header">
    <div class="nav-left">
      <img id="lobbyAvatar" src="" style="width:50px; height:50px; border-radius:50%; border:2px solid #00FF99;">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <div id="lobbyName" style="font-family:'Orbitron'; font-weight:900; font-size:14px;"></div>
        <div style="font-size:10px; color:rgba(255,255,255,0.5);">
          <span id="lobbyLevel" style="color:#00FF99;"></span> | 
          <span id="lobbyLeagueBadge" style="color:#FFD700;"></span>
        </div>
      </div>
    </div>

    <div class="credits-display">
      <div class="credits-icon">💰</div>
      <div class="credits-value" id="lobbyCredits">0</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.5); font-family:'Orbitron';">FICHAS</div>
    </div>

    <div class="nav-menu-center">
      <button class="menu-btn" onclick="openSocialModal()">👥 SOCIAL</button>
      <button class="menu-btn gold" onclick="battlePass.openBattlePassModal(currentUser)">🎫 PASE</button>
      <button class="menu-btn gold" onclick="openModal('shopModal')">🛒 TIENDA</button>
      <button class="menu-btn" style="border-color:#EF4444;color:#EF4444" onclick="doLogout()">SALIR</button>
    </div>
  </header>

  <div class="carousel-area">
    <div class="nav-arrow nav-left" onclick="moveCarousel(-1)">◀</div>
    <div class="carousel-viewport">
      <div class="carousel-track" id="carouselTrack"></div>
    </div>
    <div class="nav-arrow nav-right" onclick="moveCarousel(1)">▶</div>
  </div>

  <div class="modal" id="shopModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal('shopModal')">&times;</span>
      <h2>🛒 TIENDA DE FICHAS</h2>
      <div class="shop-grid">
        <div class="shop-item" onclick="buyCredits(1000)"><div class="shop-amount">1.000</div><div class="shop-price">1€</div></div>
        <div class="shop-item" onclick="buyCredits(5000)"><div class="shop-amount">5.000</div><div class="shop-price">5€</div></div>
        <div class="shop-item" onclick="buyCredits(10000)"><div class="shop-amount">10.000</div><div class="shop-price">10€</div></div>
        <div class="shop-item" onclick="buyCredits(50000)"><div class="shop-amount">50.000</div><div class="shop-price">50€</div></div>
      </div>
    </div>
  </div>

  <div class="modal" id="socialModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal('socialModal')">&times;</span>
      <h2>👥 LEADERBOARD GLOBAL</h2>
      <div id="leaderboardList" style="max-height:400px; overflow-y:auto;"></div>
    </div>
  </div>

  <div id="gameContainer">
    <div class="game-header">
      <span id="gameActiveTitle"></span>
      <button onclick="closeGame()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">✕</button>
    </div>
    <iframe id="gameFrame" src=""></iframe>
  </div>
</div>

<script src="/animations.js"></script>
<script src="/battlepass-system.js"></script>
<script>
const API_URL = "/api";
let currentUser = localStorage.getItem("arcade_user") || null;
let carouselIndex = 0;
let hudInterval = null;
const winAnim = new WinAnimation();

const GAMES = [
  { id: 'slots', title: 'LUCKY SEVENS', file: 'slots.html', cat: 'slots', color: '#00FF99', img: '/assets/games/0fHpJdYkysVc.jpg' },
  { id: 'keno', title: 'KENO TURBO', file: 'keno.html', cat: 'arcade', color: '#00BFFF', img: '/assets/games/6IpXKW058UDZ.jpg' },
  { id: '3_en_1', title: '3 EN 1 ARCADE', file: '3_en_1.html', cat: 'arcade', color: '#A855F7', img: '/assets/games/DZAqgKJyKLIe.jpg' },
  { id: 'blackjack', title: 'BLACKJACK VIP', file: 'blackjack.html', cat: 'mesa', color: '#FACC15', img: '/assets/games/ctMqgVaaG9Cs.jpg' },
  { id: 'crash', title: 'ROCKET CRASH', file: 'crash.html', cat: 'arcade', color: '#22C55E', img: '/assets/games/upFumWw48aLz.jpg' },
  { id: 'mines', title: 'MINES ARCADE', file: 'mines.html', cat: 'arcade', color: '#FF6B6B', img: '/assets/games/wY7BOFGHFma4.jpg' },
  { id: 'plinko', title: 'PLINKO EXTREME', file: 'plinko.html', cat: 'arcade', color: '#FF9F43', img: '/assets/games/LzigdfqGJqBH.jpg' },
  { id: 'roulette', title: 'ROULETTE ELITE', file: 'roulette.html', cat: 'mesa', color: '#FF1744', img: '/assets/games/ueFafQNyPKsD.jpg' }
];

async function doLogin(action) {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value.trim();
  if(!username || !password) { alert("Completa los campos"); return; }
  
  try {
    const res = await fetch(`${API_URL}/auth/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    
    if(res.ok) {
      const data = await res.json();
      localStorage.setItem("arcade_user", username);
      localStorage.setItem("arcade_credits", data.balance || 0);
      currentUser = username;
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("lobbyScreen").classList.remove("hidden");
      initLobby();
    } else {
      alert("Error: " + (await res.json()).detail);
    }
  } catch(e) {
    alert("Error de conexión");
  }
}

function renderGames() {
  const track = document.getElementById("carouselTrack");
  track.innerHTML = GAMES.map((g, index) => `
    <div class="game-card" data-cat="${g.cat}" style="--theme-color:${g.color}" onclick="if(this.classList.contains('active')) launchGame('${g.file}')">
      <div class="card-art"><img src="${g.img}" alt="${g.title}" style="width:100%; height:100%; object-fit:cover;"></div>
      <div class="card-info">
        <div><div style="font-family:'Orbitron'; font-weight:900; font-size:18px;">${g.title}</div></div>
        <button class="card-btn">JUGAR</button>
      </div>
    </div>
  `).join('');
}

function initLobby() {
  renderGames();
  updateHUD();
  moveCarousel(0);
  hudInterval = setInterval(updateHUD, 5000);
}

async function updateHUD() {
  if(!currentUser) return;
  try {
    const res = await fetch(`${API_URL}/progression/profile/${currentUser}`);
    if(res.ok) {
      const p = await res.json();
      document.getElementById("lobbyName").innerText = p.username.toUpperCase();
      document.getElementById("lobbyLevel").innerText = p.level;
      document.getElementById("lobbyAvatar").src = `https://api.dicebear.com/7.x/bottts/svg?seed=${p.username}`;
      document.getElementById("lobbyLeagueBadge").innerText = p.league.toUpperCase();
      
      const resW = await fetch(`${API_URL}/wallet/balance/${currentUser}`);
      if(resW.ok) {
        const w = await resW.json();
        const balance = Math.floor(w.balance);
        document.getElementById("lobbyCredits").innerText = balance.toLocaleString();
        localStorage.setItem("arcade_credits", balance);
        
        const gameFrame = document.getElementById("gameFrame");
        if(gameFrame && gameFrame.contentWindow) {
          gameFrame.contentWindow.postMessage({ type: "credits_updated", balance }, "*");
        }
      }
    }
  } catch(e) { console.log("HUD Error"); }
}

async function addFriend(username) {
  const res = await fetch(`${API_URL}/progression/friends/${currentUser}/add`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ friend_username: username })
  });
  if(res.ok) alert("Amigo añadido");
  else alert("Error al añadir amigo");
}

async function searchAndAddFriend() {
  const input = document.getElementById("searchFriendInput");
  if(!input.value.trim()) return;
  await addFriend(input.value.trim());
  input.value = "";
}

async function openSocialModal() {
  const res = await fetch(`${API_URL}/progression/leagues/leaderboard`);
  if(res.ok) {
    const data = await res.json();
    document.getElementById("leaderboardList").innerHTML = data.leaderboard.map((u, i) => `
      <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.03); padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.05);">
        <div style="font-family:'Orbitron'; font-weight:900; color:#00FF99; width:30px; text-align:center;">${i+1}</div>
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${u.username}" style="width:40px; height:40px; border-radius:50%; border:2px solid #00FF99;">
        <div style="flex:1;">
          <div style="font-weight:bold; font-size:13px;">${u.username.toUpperCase()}</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.4);">${u.rank.toUpperCase()}</div>
        </div>
        <div style="font-family:'Orbitron'; font-size:12px; color:#00BFFF; font-weight:bold;">${u.points} PTS</div>
      </div>
    `).join('');
    openModal("socialModal");
  }
}

function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

function launchGame(file) {
  if (!currentUser) { alert("Inicia sesión primero"); return; }
  const gameTitle = file.replace(".html","").replace("_", " ").toUpperCase();
  document.getElementById("gameActiveTitle").innerText = gameTitle;
  
  const gameFrame = document.getElementById("gameFrame");
  gameFrame.src = `/${file}?u=${encodeURIComponent(currentUser)}`;
  document.getElementById("gameContainer").style.display = "flex";
  
  setTimeout(() => {
    const balance = parseInt(localStorage.getItem('arcade_credits')) || 0;
    gameFrame.contentWindow.postMessage({ type: 'credits_updated', balance }, '*');
  }, 500);
}

function closeGame() {
  document.getElementById("gameContainer").style.display = "none";
  document.getElementById("gameFrame").src = "";
  updateHUD();
}

function moveCarousel(dir) {
  const cards = Array.from(document.querySelectorAll('.game-card'));
  if(!cards.length) return;
  carouselIndex = (carouselIndex + dir + cards.length) % cards.length;
  cards.forEach((c, i) => {
    c.className = "game-card";
    if(i === carouselIndex) c.classList.add("active");
    else if(i === (carouselIndex+1)%cards.length) c.classList.add("next");
    else if(i === (carouselIndex-1+cards.length)%cards.length) c.classList.add("prev");
    else c.classList.add("hidden-card");
  });
}

async function buyCredits(amount) {
  try {
    const res = await fetch(`${API_URL}/wallet/deposit`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: currentUser, amount })
    });
    if(res.ok) { 
      const data = await res.json();
      const newBalance = Math.floor(data.new_balance || 0);
      localStorage.setItem('arcade_credits', newBalance);
      document.getElementById('lobbyCredits').innerText = newBalance.toLocaleString();
      
      const gameFrame = document.getElementById('gameFrame');
      if(gameFrame && gameFrame.contentWindow) {
        gameFrame.contentWindow.postMessage({ type: 'credits_updated', balance: newBalance }, '*');
      }
      
      closeModal('shopModal');
      winAnim.fountainEffect(amount);
    } else {
      const err = await res.json();
      alert("Error al comprar: " + (err.detail || "Error desconocido"));
    }
  } catch(e) {
    alert("Error de conexión al comprar créditos.");
  }
}

function doLogout() { localStorage.clear(); window.location.reload(); }

window.onload = () => { if(currentUser) { document.getElementById("authScreen").classList.add("hidden"); document.getElementById("lobbyScreen").classList.remove("hidden"); initLobby(); } };

window.addEventListener('message', (event) => {
  if (!event.data) return;
  if (event.data.type === 'credits') {
    const balance = Math.floor(event.data.value);
    localStorage.setItem('arcade_credits', balance);
    document.getElementById('lobbyCredits').innerText = balance.toLocaleString();
  }
  if (event.data.type === 'open_shop') {
    openModal('shopModal');
  }
});
</script>
</body>
</html>
