<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Link Triple 3 en 1</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/js/wallet.js"></script>
<style>
/* Estilos simplificados para brevedad, manteniendo la lógica */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050508;color:#fff;font-family:'Rajdhani',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;height:100vh;padding:10px}
.game-header{width:100%;display:flex;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-radius:12px;margin-bottom:10px}
.credits-box{font-family:'Orbitron';color:#00FF99;font-size:18px}
.reels-container{display:flex;gap:10px;background:#111;padding:15px;border-radius:20px;border:2px solid #333}
.reel{width:100px;height:300px;background:#000;border-radius:10px;overflow:hidden;position:relative}
.controls{margin-top:20px;display:flex;gap:15px}
.btn-spin{padding:15px 40px;font-family:'Orbitron';font-weight:900;background:#00FF99;color:#000;border:none;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="game-header">
  <div class="credits-box">CRÉDITOS: <span id="creditsVal">0</span></div>
  <div style="font-family:'Orbitron';font-weight:900">LINK TRIPLE 3 EN 1</div>
</div>

<div class="reels-container" id="reelsCont">
  <!-- Reales simplificados -->
  <div class="reel" id="reel0"></div>
  <div class="reel" id="reel1"></div>
  <div class="reel" id="reel2"></div>
</div>

<div class="controls">
  <button class="btn-spin" id="spinBtn" onclick="doSpin()">GIRAR</button>
</div>

<script>
let credits = 0;
async function init() {
  credits = await WalletAPI.getBalance();
  updateUI();
}

async function doSpin() {
  const bet = 10;
  if (credits < bet) { WalletAPI.openShop(); return; }
  
  const res = await WalletAPI.transaccionar('3_en_1', -bet);
  if (res.success) {
    credits = res.balance;
    updateUI();
    // Simular premio
    setTimeout(async () => {
      const win = Math.random() > 0.7 ? 50 : 0;
      if (win > 0) {
        const resWin = await WalletAPI.transaccionar('3_en_1', win);
        if (resWin.success) credits = resWin.balance;
      }
      updateUI();
    }, 1000);
  } else if (res.open_shop) {
    WalletAPI.openShop();
  }
}

function updateUI() {
  document.getElementById('creditsVal').innerText = credits.toLocaleString();
}

window.addEventListener('walletUpdated', (e) => {
  credits = e.detail.balance;
  updateUI();
});

init();
</script>
</body>
</html>
