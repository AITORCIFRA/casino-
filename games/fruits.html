<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Fruits Party</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#22C55E;--neon:#84CC16;--gold:#F59E0B;--gold2:#FCD34D;--pink:#EC4899;--bg:#020a02;--font-d:'Bebas Neue',sans-serif;--font-u:'Orbitron',sans-serif;--font-b:'Rajdhani',sans-serif}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#081500,var(--bg));color:#fff;font-family:var(--font-b);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5rem;position:relative}

/* Vine deco */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 70%,rgba(34,197,94,.04),transparent 60%),radial-gradient(ellipse at 70% 20%,rgba(132,204,22,.03),transparent 50%);pointer-events:none;z-index:0}

.game-logo{position:relative;z-index:2;font-family:var(--font-d);font-size:clamp(1.8rem,6vw,2.8rem);letter-spacing:.15em;background:linear-gradient(135deg,#86efac,#22c55e,#fcd34d,#ec4899,#fcd34d,#22c55e);background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:logoShine 4s linear infinite;filter:drop-shadow(0 0 16px rgba(34,197,94,.6));margin-bottom:.3rem}
@keyframes logoShine{0%{background-position:0%}100%{background-position:300%}}

/* Mode banner */
.mode-banner{position:relative;z-index:2;width:100%;max-width:560px;text-align:center;font-family:var(--font-u);font-size:9px;letter-spacing:.2em;padding:.2rem;border-radius:4px;margin-bottom:.25rem;opacity:0;transition:opacity .3s}
.mode-banner.on{opacity:1}
.mode-super{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:var(--neon)}
.mode-mega{background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.35);color:var(--pink)}

/* Stats */
.stats-row{position:relative;z-index:2;display:flex;gap:.5rem;margin-bottom:.3rem;font-family:var(--font-u);font-size:9px;width:100%;max-width:560px}
.stat{flex:1;text-align:center;background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.12);border-radius:6px;padding:.3rem}
.sl{font-size:7px;letter-spacing:.12em;color:rgba(255,255,255,.3)}
.sv{font-size:.95rem}
.sv.green{color:var(--neon);text-shadow:0 0 8px var(--neon)}
.sv.gold{color:var(--gold)}
.sv.pink{color:var(--pink)}

/* Multiplier bar */
.mult-bar{position:relative;z-index:2;width:100%;max-width:560px;display:flex;gap:3px;margin-bottom:.3rem;align-items:center}
.mb-lbl{font-family:var(--font-u);font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.3);white-space:nowrap;margin-right:4px}
.mb-step{flex:1;text-align:center;font-family:var(--font-u);font-size:8px;padding:2px 0;border-radius:3px;border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.2);transition:all .3s}
.mb-step.on{border-color:var(--neon);color:var(--neon);background:rgba(132,204,22,.12);box-shadow:0 0 8px rgba(132,204,22,.25);transform:scaleY(1.2)}

/* Machine */
.machine{position:relative;z-index:2;width:100%;max-width:560px;background:linear-gradient(180deg,#061500,#020800);border:2px solid rgba(34,197,94,.25);border-radius:14px;padding:.7rem;box-shadow:0 0 50px rgba(34,197,94,.08),inset 0 0 30px rgba(0,0,0,.7)}

/* Grid */
.cluster-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#000;border:1.5px solid rgba(34,197,94,.1);border-radius:6px;overflow:hidden;height:270px;position:relative}
/* shade top/bot */
.cluster-grid::before,.cluster-grid::after{content:'';position:absolute;left:0;right:0;height:40px;z-index:10;pointer-events:none}
.cluster-grid::before{top:0;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
.cluster-grid::after{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}

.grid-cell{display:flex;align-items:center;justify-content:center;font-size:1.7rem;border:1px solid rgba(255,255,255,.03);background:rgba(0,0,0,.2);transition:transform .1s;position:relative}
.grid-cell.is-wild{background:radial-gradient(circle,rgba(245,158,11,.18),transparent 70%)}
.grid-cell.is-wild::after{content:'★';position:absolute;bottom:0;right:2px;font-size:8px;color:var(--gold);font-family:var(--font-u)}
.grid-cell.is-scatter{background:radial-gradient(circle,rgba(236,72,153,.15),transparent 70%)}

/* Cluster highlight */
.grid-cell.hl{outline:2px solid var(--neon);background:rgba(132,204,22,.1);animation:hlPulse .4s ease-in-out infinite}
@keyframes hlPulse{0%,100%{outline-color:var(--neon)}50%{outline-color:var(--gold2)}}

/* Explode */
.grid-cell.explode{animation:explodeCell .35s ease forwards}
@keyframes explodeCell{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.4);filter:brightness(3) saturate(3)}100%{transform:scale(0);opacity:0}}

/* Drop-in */
.grid-cell.drop{animation:dropIn .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes dropIn{from{transform:translateY(-55px) scale(.7);opacity:0}to{transform:none;opacity:1}}

/* Cascade badge */
.casc-badge{position:absolute;top:.4rem;right:.4rem;z-index:20;font-family:var(--font-u);font-size:9px;letter-spacing:.1em;background:rgba(132,204,22,.2);border:1px solid rgba(132,204,22,.4);border-radius:4px;padding:2px 6px;color:var(--neon);opacity:0;transition:opacity .2s;pointer-events:none}
.casc-badge.on{opacity:1}

/* Win banner */
.win-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;opacity:0;white-space:nowrap}
.win-banner.show{animation:wbIn 2.2s ease forwards}
@keyframes wbIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0}}
.wb-main{font-family:var(--font-d);font-size:2.8rem;letter-spacing:.12em;text-shadow:0 0 40px currentColor;line-height:1}
.wb-sub{font-family:var(--font-u);font-size:13px;margin-top:4px;letter-spacing:.08em}

/* Controls */
.ctrl-row{display:flex;gap:.4rem;margin-top:.5rem;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--font-u);font-size:9px;letter-spacing:.1em;padding:.4rem .7rem;border:none;border-radius:5px;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.96)}
.btn-spin{background:linear-gradient(90deg,#15803D,var(--green),var(--neon));color:#000;padding:.55rem 1.8rem;font-size:12px;font-weight:700;box-shadow:0 0 16px rgba(34,197,94,.35)}
.btn-spin:hover{filter:brightness(1.1);box-shadow:0 0 25px rgba(34,197,94,.5)}
.btn-spin:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-bet{background:rgba(34,197,94,.08);color:var(--neon);border:1px solid rgba(34,197,94,.2)}
.btn-auto{background:rgba(236,72,153,.08);color:var(--pink);border:1px solid rgba(236,72,153,.2)}
.btn-auto.on{background:rgba(236,72,153,.2)}
.lines-info{font-family:var(--font-u);font-size:7px;letter-spacing:.1em;color:rgba(255,255,255,.2);text-align:center;margin-top:.25rem}

/* FS intro */
.fs-intro{position:fixed;inset:0;z-index:100;background:rgba(2,10,2,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem}
.fs-intro.hidden{display:none}
.fs-title{font-family:var(--font-d);font-size:clamp(2rem,8vw,3.5rem);letter-spacing:.2em;background:linear-gradient(90deg,var(--neon),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(34,197,94,.5));text-align:center}
.fs-count{font-family:var(--font-u);font-size:clamp(3rem,10vw,5rem);color:var(--gold);text-shadow:0 0 30px var(--gold);letter-spacing:.1em}
.fs-sub{font-family:var(--font-u);font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.4);text-align:center}
.fs-btn{font-family:var(--font-u);font-size:11px;letter-spacing:.15em;padding:.5rem 2.5rem;background:linear-gradient(90deg,#15803D,var(--green));border:none;border-radius:6px;color:#fff;cursor:pointer}

/* Coins */
.coin{position:fixed;z-index:150;pointer-events:none;animation:coinDrop var(--dur,1s) ease-in var(--dly,0s) forwards}
@keyframes coinDrop{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(var(--dy,300px)) rotate(720deg);opacity:0}}

/* Paytable */
.paytable{position:relative;z-index:2;width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:.3rem}
.pt-cell{background:rgba(34,197,94,.03);border:1px solid rgba(34,197,94,.1);border-radius:4px;padding:3px;text-align:center}
.pt-sym{font-size:.9rem;line-height:1}
.pt-pay{font-family:var(--font-u);font-size:7px;color:var(--neon)}
.pt-pay.gold{color:var(--gold)}
.pt-pay.pink{color:var(--pink)}
</style>
</head>
<body>

<div class="fs-intro hidden" id="fsIntro">
  <div class="fs-title">✨ FREE SPINS ✨</div>
  <div class="fs-count" id="fsCountD">10</div>
  <div class="fs-sub" id="fsModeD">SUPER GIROS · WILDS EXTRA</div>
  <button class="fs-btn" onclick="startFS()">¡EMPEZAR!</button>
</div>

<div class="game-logo">🍓 FRUITS PARTY 🍓</div>
<div class="mode-banner" id="modeBanner"></div>

<div class="stats-row">
  <div class="stat"><div class="sl">CRÉDITOS</div><div class="sv green" id="credEl">500</div></div>
  <div class="stat"><div class="sl">APUESTA</div><div class="sv gold" id="betEl">5</div></div>
  <div class="stat"><div class="sl">GANANCIA</div><div class="sv pink" id="winEl">—</div></div>
  <div class="stat"><div class="sl">FREE SPINS</div><div class="sv gold" id="fsEl">—</div></div>
</div>

<div class="mult-bar" id="multBar">
  <span class="mb-lbl">CASC</span>
</div>

<div class="machine">
  <div class="win-banner" id="winBanner">
    <div class="wb-main" id="wbMain" style="color:#84CC16">WIN</div>
    <div class="wb-sub" id="wbSub"></div>
  </div>
  <div class="cluster-grid" id="cgrid">
    <div class="casc-badge" id="cascBadge">CASCADE ×1</div>
  </div>
  <div class="lines-info">6×5 CLUSTER PAYS · 🌟 WILD COL · ⭐ SCATTER FREE SPINS · CASCADA MULTIPLICADORA</div>
  <div class="ctrl-row">
    <button class="btn btn-bet" onclick="chBet(-1)">BET −</button>
    <button class="btn btn-spin" id="spinBtn" onclick="doSpin()">🍓 GIRAR</button>
    <button class="btn btn-bet" onclick="chBet(1)">BET +</button>
    <button class="btn btn-auto" id="autoBtn" onclick="toggleAuto()">AUTO</button>
  </div>
</div>

<div class="paytable">
  <div class="pt-cell"><div class="pt-sym">🍇×5</div><div class="pt-pay">×2</div></div>
  <div class="pt-cell"><div class="pt-sym">🍋×5</div><div class="pt-pay">×3</div></div>
  <div class="pt-cell"><div class="pt-sym">🍊×5</div><div class="pt-pay">×5</div></div>
  <div class="pt-cell"><div class="pt-sym">🍒×5</div><div class="pt-pay">×8</div></div>
  <div class="pt-cell"><div class="pt-sym">🍓×5</div><div class="pt-pay">×15</div></div>
  <div class="pt-cell"><div class="pt-sym">🍑×5</div><div class="pt-pay">×25</div></div>
  <div class="pt-cell"><div class="pt-sym">🫐×5</div><div class="pt-pay">×50</div></div>
  <div class="pt-cell"><div class="pt-sym">🍉×5</div><div class="pt-pay">×100</div></div>
  <div class="pt-cell"><div class="pt-sym">🌟 col</div><div class="pt-pay gold">WILD</div></div>
  <div class="pt-cell"><div class="pt-sym">⭐×3</div><div class="pt-pay pink">FREE</div></div>
</div>

<script>
const COLS=6,ROWS=5;
// 0=🍇 1=🍋 2=🍊 3=🍒 4=🍓 5=🍑 6=🫐 7=🍉 8=⭐scatter 9=🌟wild
const SYMS   =['🍇','🍋','🍊','🍒','🍓','🍑','🫐','🍉','⭐','🌟'];
const WGTS   =[  20,  18,  16,  14,  12,  10,   7,   4,   4,   3];
const CPAY   ={0:2,1:3,2:5,3:8,4:15,5:25,6:50,7:100};
const BETS   =[1,2,5,10,25,50,100];
const CASC_MULTS=[1,1.5,2,3,5,8,15,25];

let credits=500,betIdx=2,freeSpins=0,superMode=false,megaMode=false;
let spinning=false,autoRun=false;
let grid=[];

(function(){try{const p=new URLSearchParams(window.location.search);const c=parseInt(p.get('c'));if(!isNaN(c)&&c>=0)credits=c;}catch(e){}})();

// Build mult bar
(function(){
  const bar=document.getElementById('multBar');
  CASC_MULTS.forEach((m,i)=>{
    const d=document.createElement('div');d.className='mb-step';d.id='ms'+i;d.textContent='×'+m;bar.appendChild(d);
  });
})();

function setMultStep(i){document.querySelectorAll('.mb-step').forEach((el,j)=>el.classList.toggle('on',j===i));}

function rnd(isFree=false){
  let w=[...WGTS];if(superMode){w[8]*=2;w[9]*=2;}if(megaMode){w[9]*=4;}
  const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return 0;
}

function fillGrid(isFree=false){
  grid=[];for(let c=0;c<COLS;c++){grid[c]=[];for(let r=0;r<ROWS;r++)grid[c][r]=rnd(isFree);}
}

function renderGrid(animDrop=false){
  const g=document.getElementById('cgrid');
  // keep badge
  const badge=document.getElementById('cascBadge');
  g.innerHTML='';g.appendChild(badge);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const si=grid[c][r];
      const cell=document.createElement('div');
      cell.className='grid-cell'+(si===9?' is-wild':si===8?' is-scatter':'');
      if(animDrop){cell.classList.add('drop');cell.style.animationDelay=(c*.03+r*.02)+'s';}
      cell.textContent=SYMS[si];cell.dataset.c=c;cell.dataset.r=r;
      g.appendChild(cell);
    }
  }
}

function cellEl(c,r){
  // grid-cell order: r*COLS+c (after badge offset 1)
  const g=document.getElementById('cgrid');
  return g.children[r*COLS+c+1]||null;
}

function findClusters(){
  const vis=Array.from({length:COLS},()=>Array(ROWS).fill(false));
  const clusters=[];
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    if(vis[c][r])continue;
    const sym=grid[c][r];if(sym===8||sym===9)continue;
    const cluster=[];const q=[[c,r]];
    while(q.length){
      const[cc,rr]=q.shift();
      if(cc<0||cc>=COLS||rr<0||rr>=ROWS||vis[cc][rr])continue;
      const s=grid[cc][rr];if(s!==sym&&s!==9)continue;
      vis[cc][rr]=true;cluster.push([cc,rr]);
      q.push([cc+1,rr],[cc-1,rr],[cc,rr+1],[cc,rr-1]);
    }
    if(cluster.length>=5)clusters.push({sym,cells:cluster});
  }
  return clusters;
}

async function cascade(n,isFree){
  const clusters=findClusters();
  const wildCols=[];for(let c=0;c<COLS;c++){if(grid[c].every(s=>s===9))wildCols.push(c);}
  if(clusters.length===0&&wildCols.length===0)return 0;
  const bet=BETS[betIdx];
  const multIdx=Math.min(n-1,CASC_MULTS.length-1);
  const mult=CASC_MULTS[multIdx];
  setMultStep(multIdx);

  const matched=new Set();
  let roundWin=0;
  clusters.forEach(({sym,cells})=>{
    const pay=CPAY[sym]||1;
    const bonus=cells.length>=15?6:cells.length>=12?4:cells.length>=9?2.5:cells.length>=7?1.5:1;
    roundWin+=Math.floor(pay*bonus*bet*Math.ceil(cells.length/5)*mult);
    cells.forEach(([c,r])=>matched.add(c+'_'+r));
    cells.forEach(([c,r])=>{const el=cellEl(c,r);if(el)el.classList.add('hl');});
  });
  wildCols.forEach(c=>{for(let r=0;r<ROWS;r++)matched.add(c+'_'+r);roundWin+=bet*20*mult;});

  await sleep(250);
  matched.forEach(key=>{
    const[c,r]=key.split('_').map(Number);
    const el=cellEl(c,r);if(el)el.classList.add('explode');
  });
  await sleep(360);

  // Shift down
  matched.forEach(key=>{
    const[c,r]=key.split('_').map(Number);
    for(let rr=r;rr>0;rr--)grid[c][rr]=grid[c][rr-1];
    grid[c][0]=rnd(isFree);
  });
  renderGrid(true);
  await sleep(300);

  const badge=document.getElementById('cascBadge');
  badge.textContent='CASCADE ×'+n;badge.classList.add('on');
  return roundWin;
}

async function doSpin(){
  if(spinning)return;
  const isFree=freeSpins>0;const bet=BETS[betIdx];
  if(!isFree){if(credits<bet){showBanner('SIN SALDO','','#EF4444');return;}credits-=bet;}
  else{freeSpins--;updEl('fsEl',freeSpins>0?'FREE×'+freeSpins:'—');}
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('cascBadge').classList.remove('on');
  setMultStep(-1);
  updEl('winEl','...');updUI();

  fillGrid(isFree);renderGrid(true);await sleep(380);

  let totalWin=0,casc=1;
  while(true){const w=await cascade(casc,isFree);if(w<=0)break;totalWin+=w;casc++;}

  credits+=totalWin;
  document.getElementById('cascBadge').classList.remove('on');
  setMultStep(0);

  const scatters=countScatters();
  if(scatters>=3&&!isFree){
    const earned=scatters>=5?20:scatters>=4?15:10;
    if(scatters>=4){megaMode=true;superMode=false;showMode('mega');}
    else{superMode=true;megaMode=false;showMode('super');}
    showFSIntro(earned);freeSpins+=earned;
    updEl('fsEl','FREE×'+freeSpins);
  }

  if(totalWin>=bet*200)showBanner('🏆 MEGA WIN 🏆','+'+fmt(totalWin),'#EC4899');
  else if(totalWin>=bet*60)showBanner('🌟 BIG WIN!','+'+fmt(totalWin),'#F59E0B');
  else if(totalWin>=bet*15)showBanner('🍓 WIN!','+'+fmt(totalWin),'#22C55E');
  if(totalWin>0)spawnCoins(totalWin);

  updEl('winEl',totalWin>0?'+'+fmt(totalWin):'0');
  updUI();spinning=false;
  document.getElementById('spinBtn').disabled=false;

  if(freeSpins<=0){superMode=false;megaMode=false;showMode(null);}
  if(autoRun)setTimeout(doSpin,500);
  else if(isFree&&freeSpins>0)setTimeout(doSpin,400);
  if(credits<=0&&!autoRun&&freeSpins===0){credits=500;updUI();showBanner('SALDO RECARGADO','','#22C55E');}
}

function countScatters(){let n=0;for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)if(grid[c][r]===8)n++;return n;}

function showFSIntro(n){
  document.getElementById('fsCountD').textContent=n;
  document.getElementById('fsModeD').textContent=megaMode?'MEGA GIROS · WILDS 4×':'SUPER GIROS · SCATTERS 2×';
  document.getElementById('fsIntro').classList.remove('hidden');
}
function startFS(){document.getElementById('fsIntro').classList.add('hidden');doSpin();}
function showMode(m){
  const b=document.getElementById('modeBanner');
  if(!m){b.className='mode-banner';b.textContent='';return;}
  b.className='mode-banner on mode-'+m;
  b.textContent=m==='mega'?'🔥 MEGA GIROS ACTIVOS · WILDS ×4':'⚡ SUPER GIROS · SCATTERS ×2';
}

function spawnCoins(amount){
  const n=Math.min(Math.floor(amount/8)+6,35);
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='coin';
    c.textContent=['🍒','🍓','🍊','💰','⭐'][Math.floor(Math.random()*5)];
    c.style.cssText=`left:${10+Math.random()*80}%;top:8%;font-size:1.2rem;--dur:${(.4+Math.random()*.7).toFixed(2)}s;--dly:${(i*.04).toFixed(2)}s;--dy:${200+Math.random()*300}px`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),1400);
  }
}
function showBanner(txt,sub,color){
  const b=document.getElementById('winBanner'),m=document.getElementById('wbMain'),s=document.getElementById('wbSub');
  m.textContent=txt;m.style.color=color;s.textContent=sub;
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
}
function chBet(d){if(spinning)return;betIdx=Math.max(0,Math.min(BETS.length-1,betIdx+d));updEl('betEl',BETS[betIdx]);}
function toggleAuto(){autoRun=!autoRun;const btn=document.getElementById('autoBtn');btn.classList.toggle('on',autoRun);btn.textContent=autoRun?'STOP':'AUTO';if(autoRun&&!spinning)doSpin();}
function fmt(n){return Math.floor(n).toLocaleString('es-ES');}
function updEl(id,v){document.getElementById(id).textContent=v;}
function updUI(){document.getElementById('credEl').textContent=fmt(credits);try{window.parent.postMessage({type:'credits',value:credits},'*');}catch(e){}}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

fillGrid();renderGrid();updUI();
</script>
</body>
</html>
